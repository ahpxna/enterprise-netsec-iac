name: netdevops-ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  # --- Fast static gate: runs on every PR, no infra needed ---
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }

      - name: Install linters
        run: python -m pip install -r requirements-ci.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Check generated topology models
        run: |
          python scripts/render_fabric.py --check
          python scripts/render_batfish_snapshot.py --check
          python scripts/render_vm_inventory.py --check
          python scripts/render_k8s_assets.py --check
          python scripts/check_vyos_boot.py
          python scripts/check_path_b_intent.py
          python scripts/security_static_checks.py
          python scripts/check_image_lock.py
          python scripts/check_ci_contract.py
          python scripts/check_yaml_syntax.py

      - name: Check Python and Bash syntax
        run: |
          python -m compileall -q scripts compliance tests
          find scripts clab/configs -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Unit-test evidence semantics
        run: pytest tests/unit -q

      - name: Validate Docker Compose model
        run: >-
          docker compose
          --env-file .env.example
          --profile siem
          --profile ids
          --profile ztna
          --profile dmz
          --profile vpn-test
          config --quiet

      - name: Build deterministic local service images
        run: |
          docker build --pull=false -t cxyz/server1:ci docker/server1
          docker build --pull=false -t cxyz/syslog-relay:ci docker/syslog-relay

      - name: Render Kubernetes manifests with default Kustomize restrictions
        run: kubectl kustomize k8s/ >/tmp/cxyz-k8s-rendered.yaml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: cd ansible && ansible-lint

      - name: Validate controls.yaml <-> tests wiring
        run: python compliance/check_wiring.py

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { fetch-depth: 0 }
      - name: Scan every reachable commit with gitleaks
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 detect
          --source=/repo --redact --log-opts=--all

  # --- Batfish offline policy tests: catches firewall regressions pre-merge ---
  batfish-policy:
    runs-on: ubuntu-24.04
    services:
      batfish:
        image: batfish/allinone@sha256:445818fc17c0e24eb097387c84184334ad3fc42807de1ed9fef773762a0be515
        ports: ["9997:9997", "9996:9996"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements-batfish.txt
      - name: Verify generated snapshot is current
        run: python scripts/render_batfish_snapshot.py --check
      - name: Run Batfish policy tests
        env: { BATFISH_SERVICE: localhost }
        run: pytest tests/batfish -v

  # --- Terraform validate (no apply in CI) ---
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.15.9" }
      - run: terraform -chdir=terraform/libvirt init -backend=false
      - run: terraform -chdir=terraform/libvirt fmt -check -diff -recursive
      - run: terraform -chdir=terraform/libvirt validate
      - run: terraform -chdir=terraform/vyos-fabric init -backend=false
      - run: terraform -chdir=terraform/vyos-fabric fmt -check -diff -recursive
      - run: terraform -chdir=terraform/vyos-fabric validate
