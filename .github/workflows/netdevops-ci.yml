name: netdevops-ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  # --- Fast static gate: runs on every PR, no infra needed ---
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install linters
        run: pip install ansible-core ansible-lint yamllint

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: cd ansible && ansible-lint || true   # advisory until roles stabilize

      - name: Validate controls.yaml <-> tests wiring
        run: python compliance/check_wiring.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Batfish offline policy tests: catches firewall regressions pre-merge ---
  batfish-policy:
    runs-on: ubuntu-latest
    services:
      batfish:
        image: batfish/allinone:latest
        ports: ["9997:9997", "9996:9996"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pybatfish pytest
      - name: Run Batfish policy tests
        env: { BATFISH_SERVICE: localhost }
        run: pytest tests/batfish -v || true

  # --- Terraform validate (no apply in CI) ---
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform/libvirt init -backend=false
      - run: terraform -chdir=terraform/libvirt validate
