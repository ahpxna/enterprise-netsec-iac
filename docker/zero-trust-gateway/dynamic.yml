# Traefik dynamic config: forward-auth middleware sends every request to
# Authentik before it reaches an internal app. This is the "zero trust"
# gate for the home-cloud / SME use case (parents upload to NAS via SSO+VPN).
http:
  middlewares:
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
