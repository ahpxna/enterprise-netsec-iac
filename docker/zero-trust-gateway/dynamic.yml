# Traefik file-provider configuration. Docker discovery is intentionally
# disabled so the public gateway never receives the Docker daemon socket.
---
http:
  middlewares:
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email

  routers:
    authentik:
      rule: "HostRegexp(`^sso\\..+$`)"
      entryPoints: [websecure]
      service: authentik
      tls: {}
    dmzweb:
      rule: "HostRegexp(`^app\\..+$`)"
      entryPoints: [websecure]
      middlewares: [authentik]
      service: dmzweb
      tls: {}

  services:
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
    dmzweb:
      loadBalancer:
        servers:
          - url: "http://dmz-web:8080"
