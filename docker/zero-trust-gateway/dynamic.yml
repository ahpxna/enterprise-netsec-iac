# Traefik file-provider configuration. Docker discovery is intentionally
# disabled so the public gateway never receives the Docker daemon socket.
---
tls:
  certificates:
    - certFile: /run/ztna/tls.crt
      keyFile: /run/ztna/tls.key

http:
  middlewares:
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email

  routers:
    authentik:
      rule: "HostRegexp(`^sso\\..+$`)"
      entryPoints: [websecure]
      service: authentik
      tls: {}
    # Single-application forward auth requires the outpost path on the
    # protected application's host to bypass the auth middleware.
    authentik-outpost-app:
      rule: "HostRegexp(`^app\\..+$`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 100
      entryPoints: [websecure]
      service: authentik
      tls: {}
    ztna-demo:
      rule: "HostRegexp(`^app\\..+$`)"
      entryPoints: [websecure]
      middlewares: [authentik]
      service: ztna-demo
      tls: {}

  services:
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
    ztna-demo:
      loadBalancer:
        servers:
          - url: "http://ztna-demo-app:8080"
