<!-- Minimal manager config: accept remote syslog + load local rules. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <logall>yes</logall>
  </global>
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>10.1.1.0/24</allowed-ips>
    <allowed-ips>172.16.50.0/24</allowed-ips>
  </remote>
  <ruleset>
    <rule_dir>etc/rules/local</rule_dir>
    <decoder_dir>etc/decoders/local</decoder_dir>
  </ruleset>
</ossec_config>
