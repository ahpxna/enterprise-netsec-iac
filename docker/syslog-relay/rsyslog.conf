global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/run/certs/ca.crt"
  DefaultNetstreamDriverCertFile="/run/certs/relay.crt"
  DefaultNetstreamDriverKeyFile="/run/certs/relay.key"
)

module(load="imtcp")
input(
  type="imtcp"
  port="6514"
  StreamDriver.Name="gtls"
  StreamDriver.Mode="1"
  StreamDriver.AuthMode="x509/name"
  PermittedPeer=[
    "server1.companyxyz.lab",
    "edge.companyxyz.lab",
    "core.companyxyz.lab",
    "dist1.companyxyz.lab",
    "dist2.companyxyz.lab",
    "fw-core.companyxyz.lab",
    "fw-dmz.companyxyz.lab"
  ]
)

template(name="CxyzRemote" type="string" string="%timereported:::date-rfc3339% %hostname% %syslogtag%%msg%\n")
*.* action(type="omfile" file="/var/log/cxyz/remote.log" template="CxyzRemote")

# Keep the Wazuh-compatible file above unchanged. The SOC-only derivative
# carries the authenticated transport peer address so Logstash can distinguish
# the network peer from the hostname claimed inside the syslog payload.
template(name="CxyzSocRemote" type="string" string="%timereported:::date-rfc3339% %fromhost-ip% %hostname% %syslogtag%%msg%\n")
*.* action(type="omfile" file="/var/log/cxyz/soc-remote.log" template="CxyzSocRemote")
