# SOC analytics plane on Kubernetes: Elasticsearch + the one-shot job that applies the
# same roles, ILM policies and index templates as the Compose profile. Elasticsearch is
# ClusterIP-only; TLS is mandatory for HTTP and transport. Credentials come from the
# ignored runtime Secrets rendered by `make k8s-runtime-secrets`.
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: elasticsearch, namespace: cxyz-security }
spec:
  serviceName: elasticsearch
  replicas: 1
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 1000 }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch@sha256:cb637acad8808664b7c57455a2b2ee87e30b3cab210f3ccc423ff6bcc305e0b9
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          env:
            - { name: discovery.type, value: single-node }
            - { name: cluster.name, value: cxyz-soc }
            - { name: node.name, value: elasticsearch }
            - { name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
            - { name: xpack.security.enabled, value: "true" }
            - { name: xpack.security.http.ssl.enabled, value: "true" }
            - { name: xpack.security.http.ssl.key, value: certs/elasticsearch.key }
            - { name: xpack.security.http.ssl.certificate, value: certs/elasticsearch.crt }
            - { name: xpack.security.http.ssl.certificate_authorities, value: certs/ca.crt }
            - { name: xpack.security.transport.ssl.enabled, value: "true" }
            - { name: xpack.security.transport.ssl.verification_mode, value: certificate }
            - { name: xpack.security.transport.ssl.key, value: certs/elasticsearch.key }
            - { name: xpack.security.transport.ssl.certificate, value: certs/elasticsearch.crt }
            - { name: xpack.security.transport.ssl.certificate_authorities, value: certs/ca.crt }
            - name: ELASTIC_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-soc-passwords, key: ELASTIC_PASSWORD } }
          ports: [{ containerPort: 9200 }]
          startupProbe:
            tcpSocket: { port: 9200 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 9200 }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: { port: 9200 }
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
            - { name: tls, mountPath: /usr/share/elasticsearch/config/certs, readOnly: true }
          resources:
            requests: { cpu: "500m", memory: "1536Mi" }
            limits: { cpu: "2", memory: "2560Mi" }
      volumes:
        - name: tls
          secret: { secretName: cxyz-soc-elasticsearch-tls, defaultMode: 0440 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: elasticsearch, namespace: cxyz-security }
spec:
  selector: { app: elasticsearch }
  ports: [{ port: 9200, targetPort: 9200 }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: soc-elastic-bootstrap, namespace: cxyz-security }
spec:
  backoffLimit: 40
  template:
    metadata: { labels: { app: soc-elastic-bootstrap } }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: docker.elastic.co/elasticsearch/elasticsearch@sha256:cb637acad8808664b7c57455a2b2ee87e30b3cab210f3ccc423ff6bcc305e0b9
          command: ["bash", "/setup/bootstrap-elastic.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: ELASTIC_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-soc-passwords, key: ELASTIC_PASSWORD } }
            - name: KIBANA_SYSTEM_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-soc-passwords, key: KIBANA_SYSTEM_PASSWORD } }
            - name: KIBANA_BOOTSTRAP_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-soc-passwords, key: KIBANA_BOOTSTRAP_PASSWORD } }
            - name: LOGSTASH_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-soc-passwords, key: LOGSTASH_PASSWORD } }
            - name: SOC_FEATURE_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-soc-passwords, key: SOC_FEATURE_PASSWORD } }
            - name: SOC_AI_WRITER_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-soc-passwords, key: SOC_AI_WRITER_PASSWORD } }
            - name: SOC_DECISION_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-soc-passwords, key: SOC_DECISION_PASSWORD } }
            - name: SOC_RESPONSE_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-soc-passwords, key: SOC_RESPONSE_PASSWORD } }
          volumeMounts:
            - { name: ca, mountPath: /certs, readOnly: true }
            - { name: setup, mountPath: /setup, readOnly: true }
            - { name: ilm, mountPath: /setup/ilm, readOnly: true }
            - { name: templates, mountPath: /setup/templates, readOnly: true }
      volumes:
        - name: ca
          secret: { secretName: cxyz-soc-ca }
        - name: setup
          projected:
            sources:
              - configMap: { name: cxyz-soc-es-scripts }
              - configMap: { name: cxyz-soc-es-roles }
        - { name: ilm, configMap: { name: cxyz-soc-es-ilm } }
        - { name: templates, configMap: { name: cxyz-soc-es-templates } }
