# Namespace micro-segmentation for the Kubernetes security plane.
# hostNetwork enforcement is CNI-dependent; Suricata/WireGuard remain explicit
# exceptions. Regular pod-network workloads are default-denied below.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: cxyz-security }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-cluster-dns, namespace: cxyz-security }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: traefik-ingress-egress, namespace: cxyz-security }
spec:
  podSelector: { matchLabels: { app: traefik } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: authentik-server } }
      ports: [{ protocol: TCP, port: 9000 }]
    - to:
        - podSelector: { matchLabels: { app: ztna-demo-app } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ztna-demo-app, namespace: cxyz-security }
spec:
  podSelector: { matchLabels: { app: ztna-demo-app } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: traefik } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: authentik-server, namespace: cxyz-security }
spec:
  podSelector: { matchLabels: { app: authentik-server } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: traefik } }
      ports: [{ protocol: TCP, port: 9000 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app: authentik-postgres } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: authentik-worker, namespace: cxyz-security }
spec:
  podSelector: { matchLabels: { app: authentik-worker } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: authentik-postgres } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: authentik-postgres, namespace: cxyz-security }
spec:
  podSelector: { matchLabels: { app: authentik-postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: authentik-server } }
        - podSelector: { matchLabels: { app: authentik-worker } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: wazuh-indexer, namespace: cxyz-security }
spec:
  podSelector: { matchLabels: { app: wazuh-indexer } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: wazuh-manager } }
        - podSelector: { matchLabels: { app: wazuh-dashboard } }
      ports: [{ protocol: TCP, port: 9200 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: wazuh-manager, namespace: cxyz-security }
spec:
  podSelector: { matchLabels: { app: wazuh-manager } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: suricata } }
      ports:
        - { protocol: TCP, port: 1514 }
        - { protocol: TCP, port: 1515 }
    - from:
        - podSelector: { matchLabels: { app: wazuh-dashboard } }
      ports: [{ protocol: TCP, port: 55000 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app: wazuh-indexer } }
      ports: [{ protocol: TCP, port: 9200 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: wazuh-dashboard, namespace: cxyz-security }
spec:
  podSelector: { matchLabels: { app: wazuh-dashboard } }
  policyTypes: [Ingress, Egress]
  # Ordinary pod-to-dashboard ingress is denied. Administrative access should
  # use an explicitly controlled ingress/gateway or Kubernetes API port-forward.
  ingress: []
  egress:
    - to:
        - podSelector: { matchLabels: { app: wazuh-indexer } }
      ports: [{ protocol: TCP, port: 9200 }]
    - to:
        - podSelector: { matchLabels: { app: wazuh-manager } }
      ports: [{ protocol: TCP, port: 55000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: suricata-wazuh-agent, namespace: cxyz-security }
spec:
  podSelector: { matchLabels: { app: suricata } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: wazuh-manager } }
      ports:
        - { protocol: TCP, port: 1514 }
        - { protocol: TCP, port: 1515 }
