# Traefik ingress for the cxyz-security namespace only.
# Apply the matching v3.7.11 CRDs once per cluster before this file:
# kubectl apply -f https://raw.githubusercontent.com/traefik/traefik/v3.7.11/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: cxyz-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-cxyz
  namespace: cxyz-security
rules:
  - apiGroups: [""]
    resources: [services, configmaps, secrets]
    verbs: [get, list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: ["traefik.io"]
    resources:
      - middlewares
      - middlewaretcps
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - traefikservices
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-cxyz
  namespace: cxyz-security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-cxyz
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: cxyz-security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: cxyz-security
spec:
  replicas: 1
  selector:
    matchLabels: { app: traefik }
  template:
    metadata:
      labels: { app: traefik }
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
          args:
            - --providers.kubernetescrd=true
            - --providers.kubernetescrd.namespaces=cxyz-security
            - --providers.kubernetescrd.allowCrossNamespace=false
            - --providers.kubernetescrd.disableClusterScopeResources=true
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.health.address=:8082
            - --ping=true
            - --ping.entrypoint=health
            - --api.dashboard=true
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          ports:
            - { name: web, containerPort: 80 }
            - { name: websecure, containerPort: 443 }
            - { name: health, containerPort: 8082 }
          startupProbe:
            httpGet: { path: /ping, port: health }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ping, port: health }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /ping, port: health }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: cxyz-security
spec:
  type: NodePort
  selector: { app: traefik }
  ports:
    - { name: web, port: 80, targetPort: 80, nodePort: 30080 }
    - { name: websecure, port: 443, targetPort: 443, nodePort: 30443 }
