# Public Path C ingress.  Traefik deliberately does not watch the Kubernetes
# API: a public reverse proxy must not inherit namespace-wide Secret read
# privileges.  `make k8s-runtime-config` supplies the file-provider routes and
# TLS material is mounted by kubelet, not fetched with a service-account token.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: cxyz-security
spec:
  replicas: 1
  selector:
    matchLabels: { app: traefik }
  template:
    metadata:
      labels: { app: traefik }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: traefik
          image: traefik@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
          args:
            - --providers.file.filename=/etc/traefik/dynamic/dynamic.yaml
            - --providers.file.watch=true
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.health.address=:8082
            - --ping=true
            - --ping.entrypoint=health
            - --api.dashboard=true
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          ports:
            - { name: web, containerPort: 80 }
            - { name: websecure, containerPort: 443 }
            - { name: health, containerPort: 8082 }
          startupProbe:
            httpGet: { path: /ping, port: health }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ping, port: health }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /ping, port: health }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: dynamic-config, mountPath: /etc/traefik/dynamic, readOnly: true }
            - { name: ztna-tls, mountPath: /run/cxyz-ztna, readOnly: true }
      volumes:
        - { name: dynamic-config, configMap: { name: cxyz-traefik-dynamic } }
        - { name: ztna-tls, secret: { secretName: cxyz-ztna-tls } }
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: cxyz-security
spec:
  type: NodePort
  selector: { app: traefik }
  ports:
    - { name: web, port: 80, targetPort: 80, nodePort: 30080 }
    - { name: websecure, port: 443, targetPort: 443, nodePort: 30443 }
