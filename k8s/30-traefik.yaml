# =====================================================================
# Traefik as the Kubernetes ingress controller, using its native
# Kubernetes CRD provider (IngressRoute/Middleware) instead of the
# Docker provider used in docker-compose. This is the standard, more
# idiomatic way to run Traefik on k8s.
#
# PREREQUISITE — apply the Traefik CRDs once per cluster before this
# file (see k8s/README.md for the exact command):
#   kubectl apply -f https://raw.githubusercontent.com/traefik/traefik/v3.1/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
# =====================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: cxyz-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-cxyz
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets]
    verbs: [get, list, watch]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: ["traefik.io"]
    resources: [middlewares, ingressroutes, ingressroutetcps, tlsoptions, tlsstores, traefikservices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-cxyz
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-cxyz
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: cxyz-security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: cxyz-security
spec:
  replicas: 1
  selector:
    matchLabels: { app: traefik }
  template:
    metadata:
      labels: { app: traefik }
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.1
          args:
            - --providers.kubernetescrd
            - --providers.kubernetesingress
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --api.dashboard=true
          ports:
            - { name: web, containerPort: 80 }
            - { name: websecure, containerPort: 443 }
            - { name: dashboard, containerPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: cxyz-security
spec:
  type: NodePort
  selector: { app: traefik }
  ports:
    - { name: web, port: 80, targetPort: 80, nodePort: 30080 }
    - { name: websecure, port: 443, targetPort: 443, nodePort: 30443 }
    - { name: dashboard, port: 8080, targetPort: 8080 }
