# =====================================================================
# Suricata as a DaemonSet: one sensor per node, hostNetwork so it can
# actually see node-local traffic (matches docker-compose's
# network_mode: host). ConfigMaps generated from docker/ids/ (see
# k8s/README.md) — same rule file (cxyz.rules), not re-authored.
# =====================================================================
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: suricata
  namespace: cxyz-security
spec:
  selector:
    matchLabels: { app: suricata }
  template:
    metadata:
      labels: { app: suricata }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: suricata
          image: jasonish/suricata@sha256:ca6a3fad1e7765a8cf9f20a1f5e2cc3698dcda3ac10901a979b296e50601f99e
          args: ["-i", "any", "-v"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW", "SYS_NICE"]
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: config, mountPath: /etc/suricata/suricata.yaml, subPath: suricata.yaml, readOnly: true }
            - { name: rules, mountPath: /var/lib/suricata/rules, readOnly: true }
            - { name: logs, mountPath: /var/log/suricata }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
        - name: wazuh-agent
          image: wazuh/wazuh-agent@sha256:150e7af098fbe34ec7d4825a0943ec2ab87525bff3d62488f104094c3354032e
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          env:
            - { name: WAZUH_MANAGER_SERVER, value: "wazuh-manager.cxyz-security.svc" }
            - { name: WAZUH_REGISTRATION_SERVER, value: "wazuh-manager.cxyz-security.svc" }
            - name: WAZUH_AGENT_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -eu
              mkdir -p /wazuh-config-mount/etc
              cat > /wazuh-config-mount/etc/ossec.conf <<EOF
              <ossec_config>
                <client>
                  <server>
                    <address>wazuh-manager.cxyz-security.svc</address>
                    <port>1514</port>
                    <protocol>tcp</protocol>
                  </server>
                  <enrollment>
                    <enabled>yes</enabled>
                    <manager_address>wazuh-manager.cxyz-security.svc</manager_address>
                    <port>1515</port>
                    <agent_name>CHANGE_AGENT_NAME</agent_name>
                  </enrollment>
                </client>
                <localfile>
                  <log_format>json</log_format>
                  <location>/var/log/suricata/eve.json</location>
                </localfile>
              </ossec_config>
              EOF
              exec /init
          volumeMounts:
            - { name: logs, mountPath: /var/log/suricata, readOnly: true }
            - { name: wazuh-agent-config, mountPath: /wazuh-config-mount/etc }
      volumes:
        - { name: config, configMap: { name: cxyz-suricata-config } }
        - { name: rules, configMap: { name: cxyz-suricata-rules } }
        - { name: logs, emptyDir: {} }
        - { name: wazuh-agent-config, emptyDir: {} }
