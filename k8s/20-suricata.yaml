# =====================================================================
# Suricata as a DaemonSet: one sensor per node, hostNetwork so it can
# actually see node-local traffic (matches docker-compose's
# network_mode: host). ConfigMaps generated from docker/ids/ (see
# k8s/README.md) — same rule file (cxyz.rules), not re-authored.
# =====================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: suricata
  namespace: cxyz-security
spec:
  selector:
    matchLabels: { app: suricata }
  template:
    metadata:
      labels: { app: suricata }
    spec:
      hostNetwork: true
      containers:
        - name: suricata
          image: jasonish/suricata:latest
          args: ["-i", "any", "-v"]
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "SYS_NICE"]
          volumeMounts:
            - { name: config, mountPath: /etc/suricata/suricata.yaml, subPath: suricata.yaml, readOnly: true }
            - { name: rules, mountPath: /var/lib/suricata/rules, readOnly: true }
            - { name: logs, mountPath: /var/log/suricata }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - { name: config, configMap: { name: cxyz-suricata-config } }
        - { name: rules, configMap: { name: cxyz-suricata-rules } }
        - { name: logs, emptyDir: {} }
