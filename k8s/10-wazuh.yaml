# =====================================================================
# Wazuh SIEM on Kubernetes — same images/rules/decoders as docker-compose,
# reorganized as: indexer (StatefulSet, needs storage) -> manager
# (Deployment, mounts the CXYZ decoders/rules ConfigMaps) -> dashboard.
# ConfigMaps here are generated from the existing docker/siem/ files via
# `kubectl create configmap ... --from-file` (see k8s/README.md) so the
# detection rules stay a single source of truth, not duplicated by hand.
# =====================================================================
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: cxyz-security
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels: { app: wazuh-indexer }
  template:
    metadata:
      labels: { app: wazuh-indexer }
    spec:
      containers:
        - name: wazuh-indexer
          image: wazuh/wazuh-indexer:4.14.6
          env:
            - { name: OPENSEARCH_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
          ports: [{ containerPort: 9200 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/wazuh-indexer }
          resources:
            requests: { cpu: "500m", memory: "1.5Gi" }
            limits: { cpu: "2", memory: "2Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
  namespace: cxyz-security
spec:
  selector: { app: wazuh-indexer }
  ports: [{ port: 9200, targetPort: 9200 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-manager
  namespace: cxyz-security
spec:
  replicas: 1
  selector:
    matchLabels: { app: wazuh-manager }
  template:
    metadata:
      labels: { app: wazuh-manager }
    spec:
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.6
          env:
            - { name: INDEXER_URL, value: "https://wazuh-indexer:9200" }
            - { name: INDEXER_USERNAME, value: "admin" }
            - name: INDEXER_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-security-secrets, key: WAZUH_INDEXER_PASSWORD } }
          ports:
            - { containerPort: 1514, protocol: UDP }
            - { containerPort: 1515 }
            - { containerPort: 514, protocol: UDP }  # Wazuh local syslog input only; not DET-02 TLS transport
            - { containerPort: 55000 }
          volumeMounts:
            - { name: decoders, mountPath: /var/ossec/etc/decoders/local, readOnly: true }
            - { name: rules, mountPath: /var/ossec/etc/rules/local, readOnly: true }
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - { name: decoders, configMap: { name: cxyz-wazuh-decoders } }
        - { name: rules, configMap: { name: cxyz-wazuh-rules } }
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: cxyz-security
spec:
  selector: { app: wazuh-manager }
  ports:
    - { name: syslog-udp, port: 514, protocol: UDP }
    - { name: agent-events, port: 1514, protocol: UDP }
    - { name: agent-enroll, port: 1515 }
    - { name: api, port: 55000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: cxyz-security
spec:
  replicas: 1
  selector:
    matchLabels: { app: wazuh-dashboard }
  template:
    metadata:
      labels: { app: wazuh-dashboard }
    spec:
      containers:
        - name: wazuh-dashboard
          image: wazuh/wazuh-dashboard:4.14.6
          env:
            - { name: INDEXER_USERNAME, value: "admin" }
            - name: INDEXER_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-security-secrets, key: WAZUH_INDEXER_PASSWORD } }
            - name: DASHBOARD_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-security-secrets, key: WAZUH_DASHBOARD_PASSWORD } }
          ports: [{ containerPort: 5601 }]
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-dashboard
  namespace: cxyz-security
spec:
  type: ClusterIP
  selector: { app: wazuh-dashboard }
  ports: [{ port: 5601, targetPort: 5601 }]
