# Authentik SSO/IdP plus the explicitly named ZTNA demo application.
# The canonical network-fabric host remains `dmz-web`; this Docker/K8s app is
# intentionally named `ztna-demo-app` so SEG-02 and ZTNA-01 cannot be confused.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgres
  namespace: cxyz-security
spec:
  serviceName: authentik-postgres
  replicas: 1
  selector:
    matchLabels: { app: authentik-postgres }
  template:
    metadata:
      labels: { app: authentik-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          env:
            - { name: POSTGRES_USER, value: authentik }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-security-secrets, key: AUTHENTIK_POSTGRES_PASSWORD } }
            - { name: POSTGRES_DB, value: authentik }
          startupProbe:
            exec: { command: ["pg_isready", "-U", "authentik", "-d", "authentik"] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "authentik", "-d", "authentik"] }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "authentik", "-d", "authentik"] }
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: authentik-postgres, namespace: cxyz-security }
spec:
  selector: { app: authentik-postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: authentik-redis, namespace: cxyz-security }
spec:
  replicas: 1
  selector: { matchLabels: { app: authentik-redis } }
  template:
    metadata: { labels: { app: authentik-redis } }
    spec:
      containers:
        - name: redis
          image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          ports: [{ containerPort: 6379 }]
          startupProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: { name: authentik-redis, namespace: cxyz-security }
spec:
  selector: { app: authentik-redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: authentik-server, namespace: cxyz-security }
spec:
  replicas: 1
  selector: { matchLabels: { app: authentik-server } }
  template:
    metadata: { labels: { app: authentik-server } }
    spec:
      containers:
        - name: authentik-server
          image: ghcr.io/goauthentik/server@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5
          args: ["server"]
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom: { secretKeyRef: { name: cxyz-security-secrets, key: AUTHENTIK_SECRET_KEY } }
            - { name: AUTHENTIK_POSTGRESQL__HOST, value: authentik-postgres }
            - { name: AUTHENTIK_POSTGRESQL__USER, value: authentik }
            - { name: AUTHENTIK_POSTGRESQL__NAME, value: authentik }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-security-secrets, key: AUTHENTIK_POSTGRES_PASSWORD } }
            - { name: AUTHENTIK_REDIS__HOST, value: authentik-redis }
            - { name: AUTHENTIK_DISABLE_UPDATE_CHECK, value: "true" }
            - { name: CXYZ_AUTHENTIK_APP_URL, value: "https://app.companyxyz.lab" }
            - { name: CXYZ_AUTHENTIK_SSO_URL, value: "https://sso.companyxyz.lab" }
          ports: [{ containerPort: 9000 }]
          startupProbe:
            httpGet: { path: /-/health/ready/, port: 9000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /-/health/ready/, port: 9000 }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /-/health/live/, port: 9000 }
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/cxyz-ztna.yaml
              subPath: cxyz-ztna.yaml
              readOnly: true
      volumes:
        - { name: blueprints, configMap: { name: cxyz-authentik-blueprints } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: authentik-worker, namespace: cxyz-security }
spec:
  replicas: 1
  selector: { matchLabels: { app: authentik-worker } }
  template:
    metadata: { labels: { app: authentik-worker } }
    spec:
      containers:
        - name: authentik-worker
          image: ghcr.io/goauthentik/server@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5
          args: ["worker"]
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom: { secretKeyRef: { name: cxyz-security-secrets, key: AUTHENTIK_SECRET_KEY } }
            - { name: AUTHENTIK_POSTGRESQL__HOST, value: authentik-postgres }
            - { name: AUTHENTIK_POSTGRESQL__USER, value: authentik }
            - { name: AUTHENTIK_POSTGRESQL__NAME, value: authentik }
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom: { secretKeyRef: { name: cxyz-security-secrets, key: AUTHENTIK_POSTGRES_PASSWORD } }
            - { name: AUTHENTIK_REDIS__HOST, value: authentik-redis }
            - { name: AUTHENTIK_DISABLE_UPDATE_CHECK, value: "true" }
            - { name: CXYZ_AUTHENTIK_APP_URL, value: "https://app.companyxyz.lab" }
            - { name: CXYZ_AUTHENTIK_SSO_URL, value: "https://sso.companyxyz.lab" }
          startupProbe:
            exec: { command: ["ak", "healthcheck"] }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["ak", "healthcheck"] }
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            exec: { command: ["ak", "healthcheck"] }
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/cxyz-ztna.yaml
              subPath: cxyz-ztna.yaml
              readOnly: true
      volumes:
        - { name: blueprints, configMap: { name: cxyz-authentik-blueprints } }
---
apiVersion: v1
kind: Service
metadata: { name: authentik-server, namespace: cxyz-security }
spec:
  selector: { app: authentik-server }
  ports: [{ port: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ztna-demo-app, namespace: cxyz-security }
spec:
  replicas: 1
  selector: { matchLabels: { app: ztna-demo-app } }
  template:
    metadata: { labels: { app: ztna-demo-app } }
    spec:
      containers:
        - name: ztna-demo-app
          image: nginxinc/nginx-unprivileged@sha256:93722936b82ec8a1178d48448e619226680d2de3706a1640800e186cd5fa7fd3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: ztna-demo-app, namespace: cxyz-security }
spec:
  selector: { app: ztna-demo-app }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: authentik-forwardauth, namespace: cxyz-security }
spec:
  forwardAuth:
    address: "http://authentik-server.cxyz-security.svc:9000/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: false
    maxResponseBodySize: 4194304
    authResponseHeaders: [X-authentik-username, X-authentik-groups, X-authentik-email]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: authentik, namespace: cxyz-security }
spec:
  entryPoints: [websecure]
  tls: { secretName: cxyz-ztna-tls }
  routes:
    - match: "Host(`sso.companyxyz.lab`)"
      kind: Rule
      services: [{ name: authentik-server, port: 9000 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: ztna-demo, namespace: cxyz-security }
spec:
  entryPoints: [websecure]
  tls: { secretName: cxyz-ztna-tls }
  routes:
    - match: "Host(`app.companyxyz.lab`) && PathPrefix(`/outpost.goauthentik.io/`)"
      kind: Rule
      priority: 100
      services: [{ name: authentik-server, port: 9000 }]
    - match: "Host(`app.companyxyz.lab`)"
      kind: Rule
      middlewares: [{ name: authentik-forwardauth }]
      services: [{ name: ztna-demo-app, port: 8080 }]
