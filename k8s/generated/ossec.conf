<!-- Manager overlay for the official Wazuh single-node Docker baseline. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <logall>yes</logall>
  </global>
  <!-- Suricata EVE is a shared read-only volume. Logcollector parses every
       JSON record; cxyz_rules.xml correlates the expected SIDs into alerts. -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>
  <!-- Keep enrollment behavior explicit when replacing the container's
       ossec.conf so an upstream default change cannot silently disable 1515. -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>
  <indexer>
    <enabled>yes</enabled>
    <hosts><host>https://wazuh-indexer:9200</host></hosts>
    <ssl>
      <certificate_authorities><ca>/etc/ssl/root-ca.pem</ca></certificate_authorities>
      <certificate>/etc/ssl/filebeat.pem</certificate>
      <key>/etc/ssl/filebeat.key</key>
    </ssl>
  </indexer>
  <ruleset>
    <!-- Preserve the vendor default ruleset explicitly, then add the
         CompanyXYZ local directories mounted by Compose/Kubernetes. -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <decoder_dir>etc/decoders/local</decoder_dir>
    <rule_dir>etc/rules/local</rule_dir>
  </ruleset>
</ossec_config>
