<!-- Manager overlay for the official Wazuh single-node Docker baseline. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <logall>yes</logall>
  </global>
  <!-- Suricata EVE is a shared read-only volume. Logcollector parses every
       JSON record; cxyz_rules.xml correlates the expected SIDs into alerts. -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>
  <indexer>
    <enabled>yes</enabled>
    <hosts><host>https://wazuh-indexer:9200</host></hosts>
    <ssl>
      <certificate_authorities><ca>/etc/ssl/root-ca.pem</ca></certificate_authorities>
      <certificate>/etc/ssl/filebeat.pem</certificate>
      <key>/etc/ssl/filebeat.key</key>
    </ssl>
  </indexer>
  <ruleset>
    <rule_dir>etc/rules/local</rule_dir>
    <decoder_dir>etc/decoders/local</decoder_dir>
  </ruleset>
</ossec_config>
