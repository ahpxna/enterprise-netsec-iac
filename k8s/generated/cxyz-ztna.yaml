# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
---
version: 1
metadata:
  name: CompanyXYZ ZTNA demo application
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: >-
      Declarative forward-auth provider, application, and Embedded Outpost
      association for the CompanyXYZ protected demo application.
entries:
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: cxyz-ztna-demo-provider
    attrs:
      name: cxyz-ztna-demo-provider
      mode: forward_single
      external_host: !Env CXYZ_AUTHENTIK_APP_URL, https://app.companyxyz.lab
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      intercept_header_auth: true
      internal_host_ssl_validation: false

  - model: authentik_core.application
    state: present
    identifiers:
      slug: cxyz-ztna-demo
    attrs:
      name: CompanyXYZ ZTNA Demo
      slug: cxyz-ztna-demo
      meta_launch_url: !Env CXYZ_AUTHENTIK_APP_URL, https://app.companyxyz.lab
      policy_engine_mode: any
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, cxyz-ztna-demo-provider]]

  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, cxyz-ztna-demo-provider]]
      config:
        authentik_host: !Env CXYZ_AUTHENTIK_SSO_URL, https://sso.companyxyz.lab
        authentik_host_browser: !Env CXYZ_AUTHENTIK_SSO_URL, https://sso.companyxyz.lab
        authentik_host_insecure: false
