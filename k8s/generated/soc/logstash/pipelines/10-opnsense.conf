input {
  # Production OPNsense/pfSense events arrive through the authenticated mTLS
  # relay consumed in 50-network-syslog.conf. This file input is an
  # operator-only fixture path and is not exposed on a runtime network.
  file {
    id => "fixture-opnsense"
    path => ["/fixtures/firewall.log"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-fixture-opnsense"
    codec => plain
    add_field => {
      "[@metadata][source_type]" => "firewall"
      "[@metadata][observer_name]" => "fw-core"
      "[@metadata][observer_type]" => "firewall"
      "[@metadata][sensor_zone]" => "edge"
      "[@metadata][source_authentication]" => "operator_fixture"
    }
  }
}
