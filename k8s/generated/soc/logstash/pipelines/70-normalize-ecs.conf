filter {
  # Preserve the exact received payload before parsing. The clone is routed to
  # soc-raw-* and never passes through source parsing or enrichment.
  mutate {
    copy => { "message" => "[event][original]" }
  }
  fingerprint {
    source => ["[@metadata][source_type]", "message"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][source_event_id]"
  }
  clone {
    clones => ["soc_raw"]
    ecs_compatibility => "disabled"
  }

  if [type] == "soc_raw" {
    mutate {
      add_field => {
        "[event][id]" => "%{[@metadata][source_event_id]}"
        "[event][kind]" => "event"
        "[event][dataset]" => "%{[@metadata][source_type]}.raw"
        "[observer][name]" => "%{[@metadata][observer_name]}"
        "[observer][type]" => "%{[@metadata][observer_type]}"
        "[cxyz][schema_version]" => "soc-raw-v1"
        "[cxyz][sensor_zone]" => "%{[@metadata][sensor_zone]}"
        "[cxyz][source_authentication]" => "%{[@metadata][source_authentication]}"
        "[cxyz][ingestion_id]" => "%{[@metadata][source_event_id]}"
        "[@metadata][index_family]" => "raw"
      }
      remove_field => ["type"]
    }
    ruby { code => 'event.set("[event][category]", ["network"])' }
  } else {
    mutate {
      add_field => {
        "[event][id]" => "%{[@metadata][source_event_id]}"
        "[event][kind]" => "event"
        "[observer][name]" => "%{[@metadata][observer_name]}"
        "[observer][type]" => "%{[@metadata][observer_type]}"
        "[cxyz][schema_version]" => "soc-event-v1"
        "[cxyz][pipeline_version]" => "logstash-ecs-v1"
        "[cxyz][sensor]" => "%{[@metadata][observer_name]}"
        "[cxyz][sensor_zone]" => "%{[@metadata][sensor_zone]}"
        "[cxyz][source_authentication]" => "%{[@metadata][source_authentication]}"
      }
    }

    if [@metadata][source_type] == "suricata" {
      json {
        source => "message"
        tag_on_failure => ["_suricata_json_failure"]
      }
      if "_jsonparsefailure" in [tags] or "_suricata_json_failure" in [tags] {
        mutate { add_tag => ["_parse_failure"] }
      } else {
        if [timestamp] { date { match => ["timestamp", "ISO8601"] target => "@timestamp" } }
        mutate {
          rename => {
            "src_ip" => "[source][ip]"
            "src_port" => "[source][port]"
            "dest_ip" => "[destination][ip]"
            "dest_port" => "[destination][port]"
            "proto" => "[network][transport]"
            "app_proto" => "[network][protocol]"
            "community_id" => "[network][community_id]"
          }
          add_field => {
            "[event][dataset]" => "suricata.eve"
            "[cxyz][asset_role]" => "network_sensor"
          }
        }
        # Only the flow record carries final per-direction counters. Alert/dns/
        # http/tls records embed running counters of the same flow, so deriving
        # bytes from them would count one flow several times downstream.
        if [event_type] == "flow" {
          ruby {
            code => 'event.set("[network][bytes]", (event.get("[flow][bytes_toserver]") || 0).to_i + (event.get("[flow][bytes_toclient]") || 0).to_i)'
          }
        }
        if [alert] {
          mutate { add_field => { "[@metadata][index_family]" => "alerts" } }
          ruby { code => 'event.set("[event][category]", ["network", "intrusion_detection"])' }
        } else {
          mutate { add_field => { "[@metadata][index_family]" => "network" } }
          ruby { code => 'event.set("[event][category]", ["network"])' }
        }
      }
    } else if [@metadata][source_type] == "wazuh" {
      json {
        source => "message"
        tag_on_failure => ["_wazuh_json_failure"]
      }
      if "_jsonparsefailure" in [tags] or "_wazuh_json_failure" in [tags] {
        mutate { add_tag => ["_parse_failure"] }
      } else {
        if [timestamp] { date { match => ["timestamp", "ISO8601"] target => "@timestamp" } }
        mutate {
          rename => {
            "[agent][name]" => "[host][name]"
            "[data][srcip]" => "[source][ip]"
            "[data][dstip]" => "[destination][ip]"
            "[rule][level]" => "[event][severity]"
          }
          add_field => {
            "[event][dataset]" => "wazuh.alerts"
            "[cxyz][asset_role]" => "endpoint"
            "[@metadata][index_family]" => "alerts"
          }
        }
        ruby {
          code => '
            categories = ["host", "intrusion_detection"]
            groups = Array(event.get("[rule][groups]")).map(&:to_s)
            categories << "file" if groups.include?("syscheck") || event.get("[syscheck]")
            if groups.any? { |g| g =~ /authentication_fail|invalid_login|authentication_failures/ }
              categories << "authentication"
              event.set("[event][outcome]", "failure")
            elsif groups.include?("authentication_success")
              categories << "authentication"
              event.set("[event][outcome]", "success")
            end
            exe = event.get("[data][audit][exe]")
            if exe || groups.include?("audit_command") || groups.include?("process")
              categories << "process"
              name = exe.to_s.gsub(/"/, "").split("/").last
              event.set("[process][name]", name) if name && !name.empty?
            end
            event.set("[event][category]", categories.uniq)
          '
        }
      }
    } else if [@metadata][source_type] == "wazuh_archives" {
      # Wazuh archives carry every decoded endpoint event, not only the ones a
      # static rule selected, so endpoint features are not biased by rules.
      json {
        source => "message"
        tag_on_failure => ["_wazuh_archive_json_failure"]
      }
      if "_jsonparsefailure" in [tags] or "_wazuh_archive_json_failure" in [tags] {
        mutate { add_tag => ["_parse_failure"] }
      } else {
        if [timestamp] { date { match => ["timestamp", "ISO8601"] target => "@timestamp" } }
        mutate {
          rename => { "[agent][name]" => "[host][name]" }
          add_field => {
            "[event][dataset]" => "wazuh.archives"
            "[cxyz][asset_role]" => "endpoint"
            "[@metadata][index_family]" => "endpoint"
          }
        }
        ruby {
          code => '
            categories = ["host"]
            location = event.get("[location]").to_s
            decoder = event.get("[decoder][name]").to_s
            text = event.get("[full_log]").to_s
            categories << "file" if location == "syscheck" || decoder.start_with?("syscheck") || event.get("[syscheck]")
            if text =~ /Failed password|authentication failure|Invalid user/i
              categories << "authentication"
              event.set("[event][outcome]", "failure")
            elsif text =~ /Accepted (password|publickey)/i
              categories << "authentication"
              event.set("[event][outcome]", "success")
            end
            exe = event.get("[data][audit][exe]")
            if exe || decoder == "auditd"
              categories << "process"
              name = exe.to_s.gsub(/"/, "").split("/").last
              event.set("[process][name]", name) if name && !name.empty?
            end
            event.set("[event][category]", categories.uniq)
          '
        }
      }
    } else if [@metadata][source_type] == "cowrie" {
      # Honeypot interaction. Fields arrive flat from Cowrie's JSON log. Attacker-supplied passwords are
      # dropped before indexing (they can be real leaked credentials); commands, usernames and file hashes
      # are kept because they are the point of the honeypot.
      json {
        source => "message"
        tag_on_failure => ["_cowrie_json_failure"]
      }
      if "_jsonparsefailure" in [tags] or "_cowrie_json_failure" in [tags] {
        mutate { add_tag => ["_parse_failure"] }
      } else {
        if [timestamp] { date { match => ["timestamp", "ISO8601"] target => "@timestamp" } }
        mutate {
          remove_field => ["password"]
          rename => {
            "src_ip" => "[source][ip]"
            "src_port" => "[source][port]"
            "dst_ip" => "[destination][ip]"
            "dst_port" => "[destination][port]"
            "username" => "[user][name]"
            "eventid" => "[event][action]"
            "session" => "[cxyz][honeypot_session]"
            "input" => "[process][command_line]"
          }
          add_field => {
            "[event][dataset]" => "cowrie.honeypot"
            "[cxyz][asset_role]" => "honeypot"
            "[@metadata][index_family]" => "alerts"
          }
        }
        ruby {
          code => '
            action = event.get("[event][action]").to_s
            categories = ["network", "intrusion_detection"]
            severity = 4
            case action
            when "cowrie.session.connect" then severity = 3
            when "cowrie.login.failed" then severity = 5; categories << "authentication"; event.set("[event][outcome]", "failure")
            when "cowrie.login.success" then severity = 8; categories << "authentication"; event.set("[event][outcome]", "success")
            when /^cowrie\.command\./ then severity = 9; categories << "process"
            when /^cowrie\.session\.file_(download|upload)/ then severity = 10; categories << "file"
            end
            event.set("[event][severity]", severity)
            event.set("[event][category]", categories.uniq)
          '
        }
      }
    } else {
      if [@metadata][source_type] == "network_syslog" {
        grok {
          match => { "message" => "^%{TIMESTAMP_ISO8601:[@metadata][event_ts]} %{IP:[log][source][address]} %{HOSTNAME:[host][name]} %{DATA:[process][name]}(?:\\[%{POSINT:[process][pid]}\\])?: %{GREEDYDATA:[@metadata][syslog_body]}$" }
          tag_on_failure => ["_network_syslog_parse_failure"]
        }
        if "_network_syslog_parse_failure" in [tags] {
          mutate { add_tag => ["_parse_failure"] }
        } else {
          date { match => ["[@metadata][event_ts]", "ISO8601"] target => "@timestamp" }
          if [process][name] =~ /(?i)(radius|freeradius)/ {
            mutate {
              replace => {
                "[@metadata][source_type]" => "radius"
                "[@metadata][observer_name]" => "freeradius-01"
                "[@metadata][observer_type]" => "aaa"
                "[@metadata][sensor_zone]" => "dc"
                "[observer][name]" => "freeradius-01"
                "[observer][type]" => "aaa"
              }
            }
          } else if [host][name] =~ /(?i)(fw-|opnsense|pfsense)/ {
            mutate {
              replace => {
                "[@metadata][source_type]" => "firewall"
                "[@metadata][observer_name]" => "%{[host][name]}"
                "[@metadata][observer_type]" => "firewall"
                "[@metadata][sensor_zone]" => "edge"
                "[observer][name]" => "%{[host][name]}"
                "[observer][type]" => "firewall"
              }
            }
          } else {
            mutate {
              replace => {
                "[observer][name]" => "%{[host][name]}"
                "[observer][type]" => "network"
              }
            }
          }
        }
      }

      if ![@metadata][parse_body] {
        if [@metadata][syslog_body] {
          mutate { copy => { "[@metadata][syslog_body]" => "[@metadata][parse_body]" } }
        } else {
          mutate { copy => { "message" => "[@metadata][parse_body]" } }
        }
      }

      if [@metadata][source_type] == "firewall" and "_parse_failure" not in [tags] {
        if [@metadata][parse_body] =~ /^\d+,[^,]*,[^,]*,/ {
          csv {
            source => "[@metadata][parse_body]"
            target => "[cxyz][parsed]"
            columns => [
              "rule", "subrule", "anchor", "tracker", "interface", "reason",
              "action", "direction", "ip_version", "tos", "ecn", "ttl", "id",
              "offset", "flags", "protocol_id", "proto", "length", "src", "dst",
              "spt", "dpt", "data_length"
            ]
          }
          # logstash-filter-csv has no tag_on_failure; it always tags _csvparsefailure.
          if "_csvparsefailure" in [tags] {
            mutate {
              remove_tag => ["_csvparsefailure"]
              add_tag => ["_firewall_parse_failure"]
            }
          }
        } else {
          kv {
            source => "[@metadata][parse_body]"
            target => "[cxyz][parsed]"
            field_split => " "
            value_split => "="
            tag_on_failure => ["_firewall_parse_failure"]
          }
          ruby {
            code => 'p = event.get("[cxyz][parsed]") || {}; p.keys.each { |k| p[k.downcase] ||= p[k] }; event.set("[cxyz][parsed]", p)'
          }
        }
        if "_firewall_parse_failure" in [tags] {
          mutate { add_tag => ["_parse_failure"] }
        } else {
          mutate {
            copy => {
              "[cxyz][parsed][length]" => "[network][bytes]"
              "[cxyz][parsed][src]" => "[source][ip]"
              "[cxyz][parsed][dst]" => "[destination][ip]"
              "[cxyz][parsed][spt]" => "[source][port]"
              "[cxyz][parsed][dpt]" => "[destination][port]"
              "[cxyz][parsed][proto]" => "[network][transport]"
              "[cxyz][parsed][action]" => "[event][action]"
            }
            add_field => {
              "[event][dataset]" => "firewall.syslog"
              "[cxyz][asset_role]" => "firewall"
              "[@metadata][index_family]" => "network"
            }
          }
          ruby { code => 'event.set("[event][category]", ["network"])' }
        }
      } else if [@metadata][source_type] == "radius" and "_parse_failure" not in [tags] {
        grok {
          match => { "[@metadata][parse_body]" => [
            "Login %{WORD:[event][outcome]}: \\[%{DATA:[user][name]}\\].*cli %{IP:[source][ip]}",
            "user=%{NOTSPACE:[user][name]} outcome=%{WORD:[event][outcome]} src=%{IP:[source][ip]}"
          ] }
          tag_on_failure => ["_radius_parse_failure"]
        }
        if "_radius_parse_failure" in [tags] {
          mutate { add_tag => ["_parse_failure"] }
        } else {
          mutate {
            add_field => {
              "[event][dataset]" => "freeradius.auth"
              "[cxyz][asset_role]" => "authentication_service"
              "[@metadata][index_family]" => "auth"
            }
          }
          if [event][outcome] =~ /(?i)(accept|accepted|success|ok)/ {
            mutate { replace => { "[event][outcome]" => "success" } }
          } else {
            mutate { replace => { "[event][outcome]" => "failure" } }
          }
          ruby { code => 'event.set("[event][category]", ["authentication"])' }
        }
      } else if [@metadata][source_type] == "network_syslog" and "_parse_failure" not in [tags] {
        mutate {
          add_field => {
            "[event][dataset]" => "network.syslog"
            "[cxyz][asset_role]" => "network_device"
            "[@metadata][index_family]" => "network"
          }
        }
        ruby { code => 'event.set("[event][category]", ["network"])' }
      }
    }

    if "_parse_failure" in [tags] {
      mutate {
        add_field => {
          "[error][message]" => "SOC parser rejected the payload; original event retained"
          "[@metadata][index_family]" => "deadletter"
        }
      }
    } else {
      # Zone/VLAN enrichment is deterministic and never modifies event.original.
      ruby {
        code => '
          classify = lambda do |value|
            ip = value.to_s
            case ip
            when /^10\.1\.1\./ then ["management", 99, "managed_asset"]
            when /^192\.168\.10\./ then ["employee", 10, "workstation"]
            when /^192\.168\.30\./ then ["dc", 30, "server"]
            when /^192\.168\.40\./ then ["employee", 40, "workstation"]
            when /^192\.168\.50\./ then ["guest", 50, "guest_client"]
            when /^172\.16\.50\./ then ["dc", 30, "server"]
            when /^10\.255\./ then ["infrastructure", 99, "network_device"]
            when /^195\.1\.1\.(16[0-7])$/ then ["dmz", nil, "dmz_service"]
            when "" then [nil, nil, nil]
            else ["external", nil, "external_host"]
            end
          end
          source_zone, source_vlan, source_role = classify.call(event.get("[source][ip]"))
          destination_zone, = classify.call(event.get("[destination][ip]"))
          event.set("[cxyz][source_zone]", source_zone) if source_zone
          event.set("[cxyz][destination_zone]", destination_zone) if destination_zone
          if source_zone
            event.set("[cxyz][zone]", source_zone)
            # A nullable VLAN is still part of the normalized contract.  Do
            # not omit it for Internet, DMZ, or other non-VLAN sources: an
            # absent field makes otherwise valid telemetry fail schema checks
            # and hides the distinction between "not applicable" and an
            # enrichment failure.
            event.set("[cxyz][vlan]", source_vlan)
            event.set("[cxyz][asset_role]", source_role) if source_role
          else
            event.set("[cxyz][zone]", event.get("[cxyz][sensor_zone]"))
            event.set("[cxyz][vlan]", nil)
          end
        '
      }
      mutate {
        convert => {
          "[cxyz][vlan]" => "integer"
          "[source][port]" => "integer"
          "[destination][port]" => "integer"
          "[network][bytes]" => "integer"
          "[event][severity]" => "integer"
        }
        lowercase => ["[network][transport]", "[network][protocol]"]
      }
    }

    mutate {
      add_field => { "[cxyz][ingestion_id]" => "%{[@metadata][source_event_id]}" }
      remove_field => ["message"]
    }
  }
}
