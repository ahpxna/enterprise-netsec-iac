output {
  if [@metadata][index_family] == "raw" {
    elasticsearch {
      id => "soc-raw-output"
      hosts => ["https://elasticsearch:9200"]
      user => "cxyz_logstash"
      password => "${LOGSTASH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca.crt"]
      # Templates and ILM policies are installed by soc-account-setup; the writer role
      # deliberately cannot manage templates, and the indices are plain daily indices.
      manage_template => false
      ilm_enabled => false
      data_stream => false
      index => "soc-raw-%{+YYYY.MM.dd}"
      document_id => "%{[cxyz][ingestion_id]}"
      action => "create"
    }
  } else if [@metadata][index_family] == "deadletter" {
    elasticsearch {
      id => "soc-deadletter-output"
      hosts => ["https://elasticsearch:9200"]
      user => "cxyz_logstash"
      password => "${LOGSTASH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca.crt"]
      # Templates and ILM policies are installed by soc-account-setup; the writer role
      # deliberately cannot manage templates, and the indices are plain daily indices.
      manage_template => false
      ilm_enabled => false
      data_stream => false
      index => "soc-deadletter-%{+YYYY.MM.dd}"
      document_id => "%{[cxyz][ingestion_id]}"
      action => "index"
    }
  } else if [@metadata][index_family] in ["network", "endpoint", "auth", "alerts"] {
    elasticsearch {
      id => "soc-normalized-output"
      hosts => ["https://elasticsearch:9200"]
      user => "cxyz_logstash"
      password => "${LOGSTASH_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca.crt"]
      # Templates and ILM policies are installed by soc-account-setup; the writer role
      # deliberately cannot manage templates, and the indices are plain daily indices.
      manage_template => false
      ilm_enabled => false
      data_stream => false
      index => "soc-%{[@metadata][index_family]}-%{+YYYY.MM.dd}"
      document_id => "%{[cxyz][ingestion_id]}"
      action => "index"
    }
  }
}
