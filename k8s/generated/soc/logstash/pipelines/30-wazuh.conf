input {
  file {
    id => "wazuh-alerts-file"
    path => ["/var/ossec/logs/alerts/alerts.json"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-wazuh"
    codec => plain
    add_field => {
      "[@metadata][source_type]" => "wazuh"
      "[@metadata][observer_name]" => "wazuh-manager-01"
      "[@metadata][observer_type]" => "hids"
      "[@metadata][sensor_zone]" => "soc"
      "[@metadata][source_authentication]" => "read_only_volume"
    }
  }

  file {
    id => "fixture-wazuh"
    path => ["/fixtures/wazuh.json"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-fixture-wazuh"
    codec => plain
    add_field => {
      "[@metadata][source_type]" => "wazuh"
      "[@metadata][observer_name]" => "wazuh-manager-01"
      "[@metadata][observer_type]" => "hids"
      "[@metadata][sensor_zone]" => "soc"
      "[@metadata][source_authentication]" => "operator_fixture"
    }
  }
}
