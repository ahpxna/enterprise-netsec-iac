---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cxyz-security
resources:
  - 00-namespace.yaml
  # runtime-secrets.yaml is generated/applied separately by `make k8s-up`.
  - 10-wazuh.yaml
  - 20-suricata.yaml
  - 30-traefik.yaml
  - 31-authentik.yaml
  - 32-wireguard.yaml
  - 40-network-policies.yaml
configMapGenerator:
  - name: cxyz-wazuh-decoders
    files:
      - generated/cxyz_decoders.xml
  - name: cxyz-wazuh-rules
    files:
      - generated/cxyz_rules.xml
  - name: cxyz-suricata-config
    files:
      - suricata.yaml=generated/suricata.yaml
  - name: cxyz-suricata-rules
    files:
      - generated/cxyz.rules

  - name: cxyz-authentik-blueprints
    files:
      - cxyz-ztna.yaml=generated/cxyz-ztna.yaml
  - name: cxyz-wazuh-runtime-config
    files:
      - ossec.conf=generated/ossec.conf
      - opensearch.yml=generated/wazuh-indexer.yml
      - opensearch_dashboards.yml=generated/opensearch_dashboards.yml
