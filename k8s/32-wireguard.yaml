# =====================================================================
# WireGuard on Kubernetes — hostNetwork Deployment (UDP hole-punching
# through a Service doesn't work well for a VPN concentrator, so this
# mirrors real-world practice of binding it to a node's host network
# directly, same as most bare-metal WireGuard-on-k8s setups).
# =====================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: cxyz-security
spec:
  replicas: 1
  strategy: { type: Recreate }  # hostNetwork + PVC: never run two at once
  selector: { matchLabels: { app: wireguard } }
  template:
    metadata: { labels: { app: wireguard } }
    spec:
      hostNetwork: true
      containers:
        - name: wireguard
          image: linuxserver/wireguard@sha256:ee2db24277b43ec4e7529e93967dc3cea00a02bf81b749c680b2b102a6e4aa5b
          securityContext:
            capabilities: { drop: ["ALL"], add: ["NET_ADMIN"] }
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - name: SERVERPORT
              valueFrom: { configMapKeyRef: { name: cxyz-runtime-settings, key: WG_SERVER_PORT } }
            - name: PEERS
              valueFrom: { configMapKeyRef: { name: cxyz-runtime-settings, key: WG_PEER_COUNT } }
            - name: SERVERURL
              valueFrom: { configMapKeyRef: { name: cxyz-runtime-settings, key: WG_ENDPOINT } }
          startupProbe:
            exec: { command: ["wg", "show", "interfaces"] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["wg", "show", "interfaces"] }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["wg", "show", "interfaces"] }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts: [{ name: config, mountPath: /config }]
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: wireguard-config }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireguard-config
  namespace: cxyz-security
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 1Gi } }
