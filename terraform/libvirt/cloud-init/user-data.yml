#cloud-config
# Minimal, hardened base. Real config is pushed by Ansible afterwards.
hostname: cxyz-dc-services
users:
  - name: ansible
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 REPLACE_WITH_YOUR_PUBLIC_KEY
ssh_pwauth: false
package_update: true
packages: [python3, qemu-guest-agent]
runcmd:
  - systemctl enable --now qemu-guest-agent
