input {
  # Decoded endpoint events (logall_json). This stream is read-only and gives
  # the AI plane endpoint telemetry that no static rule had to select first.
  file {
    id => "wazuh-archives-file"
    path => ["/var/ossec/logs/archives/archives.json"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-wazuh-archives"
    codec => plain
    add_field => {
      "[@metadata][source_type]" => "wazuh_archives"
      "[@metadata][observer_name]" => "wazuh-manager-01"
      "[@metadata][observer_type]" => "hids"
      "[@metadata][sensor_zone]" => "soc"
      "[@metadata][source_authentication]" => "read_only_volume"
    }
  }

  file {
    id => "fixture-wazuh-archives"
    path => ["/fixtures/wazuh-archives.json"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-fixture-wazuh-archives"
    codec => plain
    add_field => {
      "[@metadata][source_type]" => "wazuh_archives"
      "[@metadata][observer_name]" => "wazuh-manager-01"
      "[@metadata][observer_type]" => "hids"
      "[@metadata][sensor_zone]" => "soc"
      "[@metadata][source_authentication]" => "operator_fixture"
    }
  }
}
