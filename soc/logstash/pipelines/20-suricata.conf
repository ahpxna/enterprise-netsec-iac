input {
  file {
    id => "suricata-eve-file"
    path => ["/var/log/suricata/eve.json"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-suricata"
    codec => plain
    add_field => {
      "[@metadata][source_type]" => "suricata"
      "[@metadata][observer_name]" => "suricata-01"
      "[@metadata][observer_type]" => "ids"
      "[@metadata][sensor_zone]" => "soc"
      "[@metadata][source_authentication]" => "read_only_volume"
    }
  }

  file {
    id => "fixture-suricata"
    path => ["/fixtures/suricata.json"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-fixture-suricata"
    codec => plain
    add_field => {
      "[@metadata][source_type]" => "suricata"
      "[@metadata][observer_name]" => "suricata-01"
      "[@metadata][observer_type]" => "ids"
      "[@metadata][sensor_zone]" => "soc"
      "[@metadata][source_authentication]" => "operator_fixture"
    }
  }
}
