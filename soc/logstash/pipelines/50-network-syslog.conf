input {
  # syslog-relay authenticates device mTLS before appending this file. No
  # unauthenticated TCP/UDP listener exists on the Logstash container.
  file {
    id => "authenticated-network-syslog-file"
    path => ["/var/log/cxyz/soc-remote.log"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-network"
    codec => plain
    add_field => {
      "[@metadata][source_type]" => "network_syslog"
      "[@metadata][observer_name]" => "syslog-relay-01"
      "[@metadata][observer_type]" => "network"
      "[@metadata][sensor_zone]" => "management"
      "[@metadata][source_authentication]" => "mtls_relay"
    }
  }
}
