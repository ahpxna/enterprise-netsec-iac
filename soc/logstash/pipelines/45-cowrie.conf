input {
  # Cowrie (SSH/Telnet honeypot in the DMZ lab) writes one JSON event per line to a named volume that
  # is mounted here read-only. Every record is attacker-initiated by construction.
  file {
    id => "cowrie-json-file"
    path => ["/honeypot/cowrie/log/cowrie/cowrie.json"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-cowrie"
    codec => plain
    add_field => {
      "[@metadata][source_type]" => "cowrie"
      "[@metadata][observer_name]" => "cowrie-dmz"
      "[@metadata][observer_type]" => "honeypot"
      "[@metadata][sensor_zone]" => "dmz"
      "[@metadata][source_authentication]" => "read_only_volume"
    }
  }
}
