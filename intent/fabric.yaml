---
version: 1
name: companyxyz

management:
  network: cxyz_mgmt
  subnet: 10.1.1.0/24
  gateway: 10.1.1.1

# Host-only/test-harness management for untrusted endpoints on Path B.
# These nodes must never share the trusted OOB L2 with routers/firewalls.
endpoint_management:
  network: cxyz_endpoint_mgmt
  subnet: 10.1.2.0/24
  gateway: 10.1.2.1

links:
  isp1_edge:
    network_name: cxyz-isp1
    cidr: 198.10.10.0/30
    kind: p2p
  isp2_edge:
    network_name: cxyz-isp2
    cidr: 197.10.10.0/30
    kind: p2p
  edge_fwcore:
    network_name: cxyz-edge-fwcore
    cidr: 10.255.0.0/30
    kind: p2p
  fwcore_core:
    network_name: cxyz-fwcore-core
    cidr: 10.255.0.4/30
    kind: p2p
  core_dist1:
    network_name: cxyz-core-dist1
    cidr: 10.255.1.0/31
    kind: p2p
  core_dist2:
    network_name: cxyz-core-dist2
    cidr: 10.255.1.2/31
    kind: p2p
  edge_fwdmz:
    network_name: cxyz-edge-fwdmz
    cidr: 10.255.0.8/30
    kind: p2p
  vlan10:
    network_name: cxyz-vlan10
    cidr: 192.168.10.0/24
    kind: lan
    bridge: vlan10
    vrrp:
      group: 10
      virtual_ip: 192.168.10.254/24
      primary: dist1
  vlan40:
    network_name: cxyz-vlan40
    cidr: 192.168.40.0/24
    kind: lan
    bridge: vlan40
    vrrp:
      group: 40
      virtual_ip: 192.168.40.254/24
      primary: dist1
  dc:
    network_name: cxyz-dc
    cidr: 172.16.50.0/24
    kind: external_bridge
    bridge: br-cxyz-dc
  dmz:
    network_name: cxyz-fwdmz-dmzweb
    cidr: 195.1.1.160/29
    kind: p2p

nodes:
  isp1:
    role: isp
    mgmt_ip: 10.1.1.201
    attachments:
      - {link: isp1_edge, address: 198.10.10.1/30}
    routes:
      - {to: 10.255.0.0/16, via: 198.10.10.2}
  isp2:
    role: isp
    mgmt_ip: 10.1.1.202
    attachments:
      - {link: isp2_edge, address: 197.10.10.1/30}
    routes:
      - {to: 10.255.0.0/16, via: 197.10.10.2}
  edge:
    role: router
    mgmt_ip: 10.1.1.10
    attachments:
      - {link: isp1_edge, address: 198.10.10.2/30}
      - {link: isp2_edge, address: 197.10.10.2/30}
      - {link: edge_fwcore, address: 10.255.0.1/30}
      - {link: edge_fwdmz, address: 10.255.0.9/30}
    routes:
      - {to: 172.16.50.0/24, via: 10.255.0.2}
      - {to: 192.168.0.0/16, via: 10.255.0.2}
      - {to: 195.1.1.160/29, via: 10.255.0.10}
  fw-core:
    role: firewall
    mgmt_ip: 10.1.1.20
    attachments:
      - {link: edge_fwcore, address: 10.255.0.2/30, zone: outside}
      - {link: fwcore_core, address: 10.255.0.5/30, zone: campus}
      - {link: dc, address: 172.16.50.254/24, zone: dc}
    routes:
      - {to: 0.0.0.0/0, via: 10.255.0.1}
      - {to: 192.168.0.0/16, via: 10.255.0.6}
  core:
    role: router
    mgmt_ip: 10.1.1.11
    attachments:
      - {link: fwcore_core, address: 10.255.0.6/30}
      - {link: core_dist1, address: 10.255.1.0/31}
      - {link: core_dist2, address: 10.255.1.2/31}
    routes:
      - {to: 0.0.0.0/0, via: 10.255.0.5}
      - {to: 172.16.50.0/24, via: 10.255.0.5}
  dist1:
    role: router
    mgmt_ip: 10.1.1.2
    attachments:
      - {link: core_dist1, address: 10.255.1.1/31}
      - {link: vlan10, address: 192.168.10.252/24}
      - {link: vlan40, address: 192.168.40.252/24}
  dist2:
    role: router
    mgmt_ip: 10.1.1.3
    attachments:
      - {link: core_dist2, address: 10.255.1.3/31}
      - {link: vlan10, address: 192.168.10.253/24}
      - {link: vlan40, address: 192.168.40.253/24}
  pc1:
    role: endpoint
    management_plane: endpoint
    mgmt_ip: 10.1.2.111
    attachments:
      - {link: vlan10, address: 192.168.10.1/24}
    routes:
      - {to: 0.0.0.0/0, via: 192.168.10.254}
  pc4:
    role: endpoint
    mgmt_ip: 10.1.1.144
    attachments:
      - {link: vlan40, address: 192.168.40.1/24}
    routes:
      - {to: 0.0.0.0/0, via: 192.168.40.254}
  server1:
    role: endpoint
    mgmt_ip: 10.1.1.50
    attachments:
      - {link: dc, address: 172.16.50.1/24}
    routes:
      - {to: 0.0.0.0/0, via: 172.16.50.254}
  fw-dmz:
    role: firewall
    mgmt_ip: 10.1.1.30
    attachments:
      - {link: edge_fwdmz, address: 10.255.0.10/30, zone: outside}
      - {link: dmz, address: 195.1.1.166/29, zone: dmz}
    routes:
      - {to: 0.0.0.0/0, via: 10.255.0.9}
      - {to: 172.16.0.0/16, via: 10.255.0.9}
      - {to: 192.168.0.0/16, via: 10.255.0.9}
  dmz-web:
    role: endpoint
    management_plane: endpoint
    mgmt_ip: 10.1.2.61
    attachments:
      - {link: dmz, address: 195.1.1.161/29}
    routes:
      - {to: 0.0.0.0/0, via: 195.1.1.166}
