# =====================================================================
# Security services plane (SIEM / IDS / Zero-Trust gateway / DMZ app).
# Profiles allow selective startup of required components:
#   docker compose --profile siem up -d
#   docker compose --profile ztna up -d
# The network fabric itself is containerlab (see clab/); this file is the
# "blue team + edge services" layer that consumes its logs.
# =====================================================================
---
name: cxyz-security

x-soc-service: &soc-service
  image: cxyz/soc-python:local
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  user: "10001:10001"

networks:
  # Created by scripts/ensure_dc_network.sh. Containerlab attaches fw-core and
  # server1 to the same backing Linux bridge, so this is one real DC segment.
  cxyz_dc:
    external: true
    name: cxyz_dc
  cxyz_edge:    # public-facing edge network for the gateway/VPN only
    driver: bridge
  # Synthetic external client network used only by VPN-01. The probe has no
  # service-network path to WireGuard and must traverse the host UDP publish.
  cxyz_vpn_test_external:
    driver: bridge
  cxyz_identity_front:
    driver: bridge
  cxyz_identity_backend:
    driver: bridge
    internal: true
  cxyz_dmz_backend:
    driver: bridge
    internal: true
  cxyz_soc_front:
    driver: bridge
  cxyz_soc_backend:
    driver: bridge
    internal: true
  # Egress-capable network used ONLY by the response orchestrator to reach firewall
  # management endpoints that live outside Docker (Path B). Path A additionally
  # attaches it to the containerlab management bridge (docker-compose.path-a.yml).
  cxyz_response_egress:
    driver: bridge

services:
  syslog-relay:
    profiles: ["siem"]
    image: cxyz/syslog-relay:local
    hostname: syslog-relay.companyxyz.lab
    restart: unless-stopped
    volumes:
      - ./docker/syslog-relay/certs/ca.crt:/run/certs/ca.crt:ro
      - ./docker/syslog-relay/certs/relay.crt:/run/certs/relay.crt:ro
      - ./docker/syslog-relay/certs/relay.key:/run/certs/relay.key:ro
      - cxyz_remote_logs:/var/log/cxyz
    networks: { cxyz_dc: { ipv4_address: 172.16.50.11 } }

  # -------------------- SIEM: Wazuh single-node --------------------
  wazuh.manager:
    profiles: ["siem"]
    image: wazuh/wazuh-manager@sha256:8665c9807a5765253c79e4b072a1b7462c997bd69be949118a8d82ce44dd33e9
    hostname: wazuh.manager
    restart: unless-stopped
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?run make secrets}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD:?run make secrets}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./docker/wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./docker/wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./docker/wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./docker/siem/decoders:/var/ossec/etc/decoders/local:ro
      - ./docker/siem/rules:/var/ossec/etc/rules/local:ro
      - ./docker/siem/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./docker/wazuh/generated/authd.pass:/var/ossec/etc/authd.pass:ro
      - ./docker/ids/logs:/var/log/suricata:ro
      - cxyz_remote_logs:/var/log/cxyz:ro
    networks: { cxyz_dc: { ipv4_address: 172.16.50.10 } }

  wazuh-indexer:
    profiles: ["siem"]
    image: wazuh/wazuh-indexer@sha256:66b7640cce54f5f20a65e8320601b4570a1306d9f9b334d30bcaa324720a517c
    hostname: wazuh-indexer
    restart: unless-stopped
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits: { memlock: { soft: -1, hard: -1 } }
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./docker/wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./docker/wazuh/certs/wazuh-indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh-indexer.key:ro
      - ./docker/wazuh/certs/wazuh-indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh-indexer.pem:ro
      - ./docker/wazuh/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./docker/wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./docker/wazuh/indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./docker/wazuh/generated/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    # Every member of the DC bridge has a fixed address: the fabric's server1 (172.16.50.1) and fw-core
    # (172.16.50.254) are configured inside containerlab nodes, invisible to Docker's IPAM, so a dynamic
    # address would be handed .1 first and collide with server1.
    networks: { cxyz_dc: { ipv4_address: 172.16.50.13 } }

  wazuh.dashboard:
    profiles: ["siem"]
    image: wazuh/wazuh-dashboard@sha256:eeff857a664b3c09d3df4407b8749a351f321e4f366ca60ea1dffaa76f2146a7
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on: [wazuh-indexer, wazuh.manager]
    ports: ["127.0.0.1:5601:5601"]
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?run make secrets}
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD:?run make secrets}
      - WAZUH_API_URL=https://wazuh.manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD:?run make secrets}
    volumes:
      - ./docker/wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./docker/wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./docker/wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./docker/wazuh/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - wazuh_dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh_dashboard_custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks: { cxyz_dc: { ipv4_address: 172.16.50.14 } }

  # -------------------- IDS: Suricata (AF-PACKET) ------------------
  suricata:
    profiles: ["ids"]
    image: jasonish/suricata@sha256:ca6a3fad1e7765a8cf9f20a1f5e2cc3698dcda3ac10901a979b296e50601f99e
    hostname: suricata
    restart: unless-stopped
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    network_mode: host          # mirror/monitor the host bridge span
    volumes:
      - ./docker/ids/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./docker/ids/rules:/var/lib/suricata/rules:ro
      - ./docker/ids/logs:/var/log/suricata
    command: ["-i", "any", "-v"]

  # -------------------- SOC analytics plane ------------------------
  soc-cert-init:
    profiles: ["soc"]
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:cb637acad8808664b7c57455a2b2ee87e30b3cab210f3ccc423ff6bcc305e0b9
    user: "0"
    command:
      - bash
      - -ec
      - >-
        install -o 1000 -g 0 -m 0644 /source/ca.crt /ca/ca.crt;
        install -o 1000 -g 0 -m 0644 /source/ca.crt /es/ca.crt;
        install -o 1000 -g 0 -m 0644 /source/elasticsearch.crt /es/elasticsearch.crt;
        install -o 1000 -g 0 -m 0640 /source/elasticsearch.key /es/elasticsearch.key;
        install -o 1000 -g 0 -m 0644 /source/ca.crt /kibana/ca.crt;
        install -o 1000 -g 0 -m 0644 /source/kibana.crt /kibana/kibana.crt;
        install -o 1000 -g 0 -m 0640 /source/kibana.key /kibana/kibana.key;
        install -o 1000 -g 0 -m 0644 /source/ca.crt /logstash/ca.crt;
        install -o 1000 -g 0 -m 0644 /source/logstash.crt /logstash/logstash.crt;
        install -o 1000 -g 0 -m 0640 /source/logstash.key /logstash/logstash.key;
        install -d -o 1000 -g 0 -m 0750 /fixtures
    volumes:
      # Never mount the local CA signing key. The init job receives only the
      # public CA and the minimum leaf material it must distribute.
      - ./soc/certs/ca.crt:/source/ca.crt:ro
      - ./soc/certs/elasticsearch.crt:/source/elasticsearch.crt:ro
      - ./soc/certs/elasticsearch.key:/source/elasticsearch.key:ro
      - ./soc/certs/kibana.crt:/source/kibana.crt:ro
      - ./soc/certs/kibana.key:/source/kibana.key:ro
      - ./soc/certs/logstash.crt:/source/logstash.crt:ro
      - ./soc/certs/logstash.key:/source/logstash.key:ro
      - soc_ca:/ca
      - elasticsearch_certs:/es
      - kibana_certs:/kibana
      - logstash_certs:/logstash
      # Docker creates the fixture volume root-owned; Logstash (uid 1000) and the
      # smoke/live verifiers append fixture lines into it as that user.
      - soc_fixtures:/fixtures
    networks: [cxyz_soc_backend]

  elasticsearch:
    profiles: ["soc"]
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:cb637acad8808664b7c57455a2b2ee87e30b3cab210f3ccc423ff6bcc305e0b9
    hostname: elasticsearch
    restart: unless-stopped
    depends_on:
      soc-cert-init: { condition: service_completed_successfully }
    environment:
      discovery.type: single-node
      cluster.name: cxyz-soc
      node.name: elasticsearch
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run make secrets}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: certs/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca.crt
    ulimits: { memlock: { soft: -1, hard: -1 } }
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
      - elasticsearch_certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --cacert config/certs/ca.crt --user elastic:$${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 60
    networks: [cxyz_soc_backend]

  soc-account-setup:
    profiles: ["soc"]
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:cb637acad8808664b7c57455a2b2ee87e30b3cab210f3ccc423ff6bcc305e0b9
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run make secrets}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?run make secrets}
      KIBANA_BOOTSTRAP_PASSWORD: ${KIBANA_BOOTSTRAP_PASSWORD:?run make secrets}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?run make secrets}
    command: ["bash", "/setup/bootstrap-elastic.sh"]
    volumes:
      - soc_ca:/certs:ro
      - ./soc/elasticsearch/bootstrap-elastic.sh:/setup/bootstrap-elastic.sh:ro
      - ./soc/elasticsearch/logstash-writer-role.json:/setup/logstash-writer-role.json:ro
      - ./soc/elasticsearch/feature-engine-role.json:/setup/feature-engine-role.json:ro
      - ./soc/elasticsearch/ai-event-writer-role.json:/setup/ai-event-writer-role.json:ro
      - ./soc/elasticsearch/decision-engine-role.json:/setup/decision-engine-role.json:ro
      - ./soc/elasticsearch/response-orchestrator-role.json:/setup/response-orchestrator-role.json:ro
      - ./soc/elasticsearch/ilm:/setup/ilm:ro
      - ./soc/elasticsearch/templates:/setup/templates:ro
    networks: [cxyz_soc_backend]

  logstash:
    profiles: ["soc"]
    image: docker.elastic.co/logstash/logstash@sha256:04908aea76eb20de8d7bbaf6870db06419c7db3bbc856266c7a11c7db4972345
    hostname: logstash
    restart: unless-stopped
    depends_on:
      soc-account-setup: { condition: service_completed_successfully }
    environment:
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?run make secrets}
    volumes:
      - ./soc/logstash/config:/usr/share/logstash/config:ro
      - ./soc/logstash/pipelines:/usr/share/logstash/pipeline:ro
      - logstash_certs:/usr/share/logstash/certs:ro
      - logstash_data:/usr/share/logstash/data
      - ./docker/ids/logs:/var/log/suricata:ro
      - wazuh_logs:/var/ossec/logs:ro
      - cxyz_remote_logs:/var/log/cxyz:ro
      - dmzlab_cowrie_var:/honeypot/cowrie:ro
      - soc_fixtures:/fixtures
    healthcheck:
      # Healthy only once the soc-ingestion pipeline is loaded: the API answers (and a bare
      # /_node/pipelines succeeds) even while a broken pipeline makes Logstash crash-loop.
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9600/_node/pipelines/soc-ingestion >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 60
    networks: [cxyz_soc_backend]

  kibana:
    profiles: ["soc"]
    image: docker.elastic.co/kibana/kibana@sha256:cb4056251fb4116bbfe4de272284fd3d3f43159ef7a5ffe7c18b64d21ceafb12
    hostname: kibana
    restart: unless-stopped
    depends_on:
      soc-account-setup: { condition: service_completed_successfully }
    ports: ["127.0.0.1:5602:5601"]
    environment:
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?run make secrets}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/ca.crt
      ELASTICSEARCH_SSL_VERIFICATIONMODE: full
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /usr/share/kibana/config/certs/kibana.crt
      SERVER_SSL_KEY: /usr/share/kibana/config/certs/kibana.key
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY:?run make secrets}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY:?run make secrets}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY:?run make secrets}
      TELEMETRY_ENABLED: "false"
    volumes:
      - kibana_certs:/usr/share/kibana/config/certs:ro
      - kibana_data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --cacert config/certs/ca.crt https://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 60
    networks: [cxyz_soc_front, cxyz_soc_backend]

  soc-kibana-setup:
    profiles: ["soc"]
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:cb637acad8808664b7c57455a2b2ee87e30b3cab210f3ccc423ff6bcc305e0b9
    depends_on:
      kibana: { condition: service_healthy }
    environment:
      KIBANA_BOOTSTRAP_PASSWORD: ${KIBANA_BOOTSTRAP_PASSWORD:?run make secrets}
    command: ["bash", "/setup/bootstrap-kibana.sh"]
    volumes:
      - soc_ca:/certs:ro
      - ./soc/kibana/bootstrap-kibana.sh:/setup/bootstrap-kibana.sh:ro
      - ./soc/kibana/saved-objects:/setup/saved-objects:ro
    networks: [cxyz_soc_front]

  # The saved-object importer has Kibana management capability only for the
  # short bootstrap window. This backend-only job revokes it immediately.
  soc-kibana-bootstrap-revoke:
    profiles: ["soc"]
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:cb637acad8808664b7c57455a2b2ee87e30b3cab210f3ccc423ff6bcc305e0b9
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run make secrets}
    command: ["bash", "/setup/revoke-kibana-bootstrap.sh"]
    volumes:
      - soc_ca:/certs:ro
      - ./soc/elasticsearch/revoke-kibana-bootstrap.sh:/setup/revoke-kibana-bootstrap.sh:ro
    networks: [cxyz_soc_backend]

  # -------------------- SOC AI and response services ---------------
  # Profile `soc-ai` (always combined with `soc`). Every service has its own
  # credential volume; none can read another service's key. Elasticsearch stays
  # unpublished and the AI inference API holds no Elasticsearch credential at all.
  soc-service-init:
    profiles: ["soc-ai"]
    image: docker.elastic.co/elasticsearch/elasticsearch@sha256:cb637acad8808664b7c57455a2b2ee87e30b3cab210f3ccc423ff6bcc305e0b9
    user: "0"
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?run make secrets}
      VYOS_API_KEY: ${VYOS_API_KEY:-}
      WAZUH_RESPONSE_CREDENTIALS: ${WAZUH_RESPONSE_CREDENTIALS:-}
      OPNSENSE_CREDENTIALS: ${OPNSENSE_CREDENTIALS:-}
      # 1 = rotate every service API key (make soc-ai-rotate-keys); otherwise valid keys are kept.
      SOC_ROTATE_SERVICE_KEYS: ${SOC_ROTATE_SERVICE_KEYS:-0}
    command: ["bash", "/setup/provision-service-credentials.sh"]
    volumes:
      - soc_ca:/certs:ro
      - ./soc/elasticsearch/provision-service-credentials.sh:/setup/provision-service-credentials.sh:ro
      - ./soc/elasticsearch/feature-engine-role.json:/setup/feature-engine-role.json:ro
      - ./soc/elasticsearch/ai-event-writer-role.json:/setup/ai-event-writer-role.json:ro
      - ./soc/elasticsearch/decision-engine-role.json:/setup/decision-engine-role.json:ro
      - ./soc/elasticsearch/response-orchestrator-role.json:/setup/response-orchestrator-role.json:ro
      # Explicit file-level mounts: no CA signing key and no unrelated private key.
      - ./soc/certs/soc-ai-api.crt:/source/soc-ai-api.crt:ro
      - ./soc/certs/soc-ai-api.key:/source/soc-ai-api.key:ro
      - ./soc/certs/ai-client-ca.crt:/source/ai-client-ca.crt:ro
      - ./soc/certs/soc-enrichment.crt:/source/soc-enrichment.crt:ro
      - ./soc/certs/soc-enrichment.key:/source/soc-enrichment.key:ro
      - ./soc/certs/soc-decision.crt:/source/soc-decision.crt:ro
      - ./soc/certs/soc-decision.key:/source/soc-decision.key:ro
      - ./soc/certs/decision-ca.crt:/source/decision-ca.crt:ro
      - ./docker/wazuh/certs/root-ca-manager.pem:/source/wazuh-root-ca.pem:ro
      - ./soc/certs/soc-response.crt:/source/soc-response.crt:ro
      - ./soc/certs/soc-response.key:/source/soc-response.key:ro
      - ./soc/certs/decision/decision-key-1.key:/source/decision-key-1.key:ro
      - ./soc/certs/decision/decision-key-1.pub:/source/decision-key-1.pub:ro
      - soc_run_ai_api:/out/ai-api
      - soc_run_feature:/out/feature
      - soc_run_enrichment:/out/enrichment
      - soc_run_decision:/out/decision
      - soc_run_response:/out/response
    networks: [cxyz_soc_backend]

  soc-ai-api:
    <<: *soc-service
    profiles: ["soc-ai"]
    hostname: soc-ai-api
    depends_on:
      soc-service-init: { condition: service_completed_successfully }
    environment:
      SOC_AI_MODEL_DIR: /models/active
      SOC_AI_METADATA_SHA256: ${SOC_AI_METADATA_SHA256:-}
      SOC_AI_BIND: container-address
      SOC_AI_SERVER_CERT: /run/soc/tls.crt
      SOC_AI_SERVER_KEY: /run/soc/tls.key
      SOC_AI_CLIENT_CA: /run/soc/client-ca.crt
    command: ["python", "-m", "ai.api.serve"]
    volumes:
      - ./ai/registry/active:/models/active:ro
      - soc_run_ai_api:/run/soc:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;socket.create_connection((socket.gethostbyname(socket.gethostname()),8443),3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [cxyz_soc_backend]

  soc-feature-worker:
    <<: *soc-service
    profiles: ["soc-ai"]
    hostname: soc-feature-worker
    depends_on:
      soc-service-init: { condition: service_completed_successfully }
    environment:
      SOC_ES_URL: https://elasticsearch:9200
      SOC_ES_CA: /run/soc/ca.crt
      SOC_ES_API_KEY_FILE: /run/soc/es.key
      SOC_GIT_SHA: ${SOC_GIT_SHA:-0000000}
    command: ["python", "-m", "soc.workers.features", "--state", "/var/lib/soc/features/state.sqlite", "run", "--loop", "--interval", "60"]
    volumes:
      - soc_run_feature:/run/soc:ro
      - soc_state_feature:/var/lib/soc
    networks: [cxyz_soc_backend]

  soc-enrichment-worker:
    <<: *soc-service
    profiles: ["soc-ai"]
    hostname: soc-enrichment
    depends_on:
      soc-service-init: { condition: service_completed_successfully }
      soc-ai-api: { condition: service_healthy }
    environment:
      SOC_ES_URL: https://elasticsearch:9200
      SOC_ES_CA: /run/soc/ca.crt
      SOC_ES_API_KEY_FILE: /run/soc/es.key
      SOC_AI_URL: https://soc-ai-api:8443
      SOC_AI_CA: /run/soc/ca.crt
      SOC_AI_CLIENT_CERT: /run/soc/client.crt
      SOC_AI_CLIENT_KEY: /run/soc/client.key
      SOC_AI_METADATA_SHA256: ${SOC_AI_METADATA_SHA256:-}
    command: ["python", "-m", "soc.workers.enrichment", "--outbox", "/var/lib/soc/enrichment/outbox.sqlite", "serve", "--interval", "30"]
    volumes:
      - soc_run_enrichment:/run/soc:ro
      - soc_state_enrichment:/var/lib/soc
    networks: [cxyz_soc_backend]

  soc-decision:
    <<: *soc-service
    profiles: ["soc-ai"]
    hostname: soc-decision
    depends_on:
      soc-service-init: { condition: service_completed_successfully }
    command: ["python", "-m", "response.service", "decision", "--config", "/etc/soc/decision.yaml"]
    environment:
      SOC_MODE: ${SOC_MODE:-}   # empty keeps the reviewed mode (observe); `enforce` only for validation runs
    volumes:
      - ./response/deployments/${SOC_PATH:-path-a}/decision.yaml:/etc/soc/decision.yaml:ro
      - ./response/policies/${SOC_POLICY:-default}.yaml:/etc/soc/policy.yaml:ro
      - soc_run_decision:/run/soc:ro
      - soc_state_decision:/var/lib/soc
    networks: [cxyz_soc_backend]

  soc-response:
    <<: *soc-service
    profiles: ["soc-ai"]
    hostname: soc-response
    depends_on:
      soc-service-init: { condition: service_completed_successfully }
    command: ["python", "-m", "response.service", "orchestrator", "--config", "/etc/soc/response.yaml"]
    environment:
      SOC_MODE: ${SOC_MODE:-}
    volumes:
      - ./response/deployments/${SOC_PATH:-path-a}/response.yaml:/etc/soc/response.yaml:ro
      - ./response/policies/${SOC_POLICY:-default}.yaml:/etc/soc/policy.yaml:ro
      - soc_run_response:/run/soc:ro
      - soc_state_response:/var/lib/soc
    healthcheck:
      # Probe the address the orchestrator binds (the interface toward Elasticsearch): with four networks the
      # container hostname resolves to an arbitrary one of them.
      test: ["CMD", "python", "-c", "import socket;from soc.workers.common import address_toward;socket.create_connection((address_toward('elasticsearch'),8443),3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    # Backend network for ES + intake; egress network to reach firewall management
    # endpoints; the DC bridge to reach the Wazuh manager API (never published).
    networks:
      cxyz_soc_backend: {}
      cxyz_response_egress: {}
      cxyz_dc: { ipv4_address: 172.16.50.15 }   # fixed: a dynamic address would take server1's .1

  # -------------------- Zero-Trust gateway -------------------------
  traefik:
    profiles: ["ztna"]
    image: traefik@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    hostname: traefik
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/zero-trust-gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./docker/zero-trust-gateway/certs/tls.crt:/run/ztna/tls.crt:ro
      - ./docker/zero-trust-gateway/certs/tls.key:/run/ztna/tls.key:ro
    networks: [cxyz_edge, cxyz_identity_front, cxyz_dmz_backend]

  authentik-server:
    profiles: ["ztna"]
    image: ghcr.io/goauthentik/server@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5
    hostname: authentik
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?run make secrets}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?run make secrets}
      AUTHENTIK_WEB__BASE_URL: https://sso.${ORG_DOMAIN:-companyxyz.lab}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      CXYZ_AUTHENTIK_APP_URL: https://app.${ORG_DOMAIN:-companyxyz.lab}
      CXYZ_AUTHENTIK_SSO_URL: https://sso.${ORG_DOMAIN:-companyxyz.lab}
    volumes:
      - ./docker/authentik/blueprints/cxyz-ztna.yaml:/blueprints/cxyz-ztna.yaml:ro
    depends_on: [authentik-postgres]
    networks: [cxyz_identity_front, cxyz_identity_backend]

  # Background jobs, blueprints, and embedded-outpost lifecycle require a
  # worker in addition to the web server.
  authentik-worker:
    profiles: ["ztna"]
    image: ghcr.io/goauthentik/server@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5
    hostname: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?run make secrets}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?run make secrets}
      AUTHENTIK_WEB__BASE_URL: https://sso.${ORG_DOMAIN:-companyxyz.lab}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      CXYZ_AUTHENTIK_APP_URL: https://app.${ORG_DOMAIN:-companyxyz.lab}
      CXYZ_AUTHENTIK_SSO_URL: https://sso.${ORG_DOMAIN:-companyxyz.lab}
    volumes:
      - ./docker/authentik/blueprints/cxyz-ztna.yaml:/blueprints/cxyz-ztna.yaml:ro
    depends_on: [authentik-postgres]
    networks: [cxyz_identity_front, cxyz_identity_backend]

  authentik-postgres:
    profiles: ["ztna"]
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?run make secrets}
      POSTGRES_DB: authentik
    # Fresh 2026.8 state must never auto-mount the legacy authentik_db volume.
    volumes: ["authentik_db_2026:/var/lib/postgresql/data"]
    networks: [cxyz_identity_backend]

  wireguard:
    profiles: ["ztna"]
    image: linuxserver/wireguard@sha256:ee2db24277b43ec4e7529e93967dc3cea00a02bf81b749c680b2b102a6e4aa5b
    hostname: wireguard
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment:
      - PUID=1000
      - PGID=1000
      - SERVERPORT=${WG_SERVER_PORT:-51820}
      - PEERS=${WG_PEER_COUNT:-4}
      - SERVERURL=${WG_ENDPOINT:-auto}
      - VPN_PEER_SUBNET=10.13.13.0/24
      - VPN_ADMIN_SUBNET=172.16.50.0/24
      - VPN_ADMIN_PROBE_IP=172.16.50.1
    ports: ["${WG_SERVER_PORT:-51820}:${WG_SERVER_PORT:-51820}/udp"]
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    volumes:
      - ./wireguard/config:/config
      - ./docker/zero-trust-gateway/wireguard-dc-route.sh:/custom-cont-init.d/40-cxyz-dc-route.sh:ro
    networks:
      cxyz_edge: {}
      cxyz_dc: { ipv4_address: 172.16.50.12 }

  vpn-probe:
    profiles: ["vpn-test"]
    image: linuxserver/wireguard@sha256:ee2db24277b43ec4e7529e93967dc3cea00a02bf81b749c680b2b102a6e4aa5b
    hostname: vpn-probe
    cap_add: [NET_ADMIN]
    environment:
      - PUID=1000
      - PGID=1000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: ["./wireguard/probe:/config"]
    networks: [cxyz_vpn_test_external]

  # -------------------- DMZ demo app (behind gateway) --------------
  ztna-demo-app:
    profiles: ["dmz"]
    image: nginxinc/nginx-unprivileged@sha256:93722936b82ec8a1178d48448e619226680d2de3706a1640800e186cd5fa7fd3
    hostname: ztna-demo-app
    restart: unless-stopped
    networks: [cxyz_dmz_backend]

  # -------------------- DMZ deception lab (profile dmzlab, Path A) ------------------
  # A deliberately vulnerable web application and an SSH/Telnet honeypot for generating and
  # studying hostile traffic. Both JOIN THE NETWORK NAMESPACE of the containerlab `dmz-web` node
  # (start the fabric first), so they live on the DMZ segment behind fw-dmz with dmz-web's address
  # 195.1.1.161: every probe crosses fw-dmz (logged, counted, seen by Suricata) and the existing
  # pivot deny stops any of them from reaching internal zones. They have no network of their own,
  # publish no host port, run without capabilities and are disposable.
  #   dmz-vuln      OWASP Juice Shop  tcp/3000         (OWASP flagship; use only here)
  #   dmz-honeypot  Cowrie            tcp/2222 ssh, tcp/2223 telnet; JSON log -> Logstash (read-only)
  dmz-vuln:
    profiles: ["dmzlab"]
    image: bkimminich/juice-shop@sha256:cea5a4af4aacee498c491491af0408934ec81d004035c0a02ef3e54395e3bf27
    network_mode: "container:clab-companyxyz-dmz-web"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    tmpfs: ["/tmp:size=64m"]

  dmz-honeypot:
    profiles: ["dmzlab"]
    image: cowrie/cowrie@sha256:019726c8deef20729162cda492d9385917b579c9ace6368e47e7566cd2491ba1
    network_mode: "container:clab-companyxyz-dmz-web"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m
    tmpfs: ["/tmp:size=16m"]
    environment:
      COWRIE_TELNET_ENABLED: "true"
    volumes:
      - dmzlab_cowrie_var:/cowrie/cowrie-git/var

volumes:
  dmzlab_cowrie_var:
  authentik_db_2026:
  cxyz_remote_logs:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh_indexer_data:
  wazuh_dashboard_config:
  wazuh_dashboard_custom:
  elastic_data:
  soc_ca:
  elasticsearch_certs:
  kibana_certs:
  logstash_certs:
  logstash_data:
  soc_fixtures:
  kibana_data:
  soc_run_ai_api:
  soc_run_feature:
  soc_run_enrichment:
  soc_run_decision:
  soc_run_response:
  soc_state_feature:
  soc_state_enrichment:
  soc_state_decision:
  soc_state_response:
