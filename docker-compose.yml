# =====================================================================
# Security services plane (SIEM / IDS / Zero-Trust gateway / DMZ app).
# Profiles allow selective startup of required components:
#   docker compose --profile siem up -d
#   docker compose --profile ztna up -d
# The network fabric itself is containerlab (see clab/); this file is the
# "blue team + edge services" layer that consumes its logs.
# =====================================================================
---
name: cxyz-security

networks:
  # Created by scripts/ensure_dc_network.sh. Containerlab attaches fw-core and
  # server1 to the same backing Linux bridge, so this is one real DC segment.
  cxyz_dc:
    external: true
    name: cxyz_dc
  cxyz_edge:    # public-facing edge network for the gateway
    driver: bridge

services:
  syslog-relay:
    profiles: ["siem"]
    image: cxyz/syslog-relay:local
    hostname: syslog-relay.companyxyz.lab
    restart: unless-stopped
    volumes:
      - ./docker/syslog-relay/certs:/run/certs:ro
      - cxyz_remote_logs:/var/log/cxyz
    networks: { cxyz_dc: { ipv4_address: 172.16.50.11 } }

  # -------------------- SIEM: Wazuh single-node --------------------
  wazuh.manager:
    profiles: ["siem"]
    image: wazuh/wazuh-manager:4.14.6
    hostname: wazuh.manager
    restart: unless-stopped
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?run make secrets}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD:?run make secrets}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./docker/wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./docker/wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./docker/wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./docker/siem/decoders:/var/ossec/etc/decoders/local:ro
      - ./docker/siem/rules:/var/ossec/etc/rules/local:ro
      - ./docker/siem/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./docker/ids/logs:/var/log/suricata:ro
      - cxyz_remote_logs:/var/log/cxyz:ro
    networks: { cxyz_dc: { ipv4_address: 172.16.50.10 } }

  wazuh.indexer:
    profiles: ["siem"]
    image: wazuh/wazuh-indexer:4.14.6
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits: { memlock: { soft: -1, hard: -1 } }
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./docker/wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./docker/wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./docker/wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./docker/wazuh/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./docker/wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./docker/wazuh/indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./docker/wazuh/generated/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    networks: [cxyz_dc]

  wazuh.dashboard:
    profiles: ["siem"]
    image: wazuh/wazuh-dashboard:4.14.6
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on: [wazuh.indexer, wazuh.manager]
    ports: ["127.0.0.1:5601:5601"]
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?run make secrets}
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD:?run make secrets}
      - WAZUH_API_URL=https://wazuh.manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD:?run make secrets}
    volumes:
      - ./docker/wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./docker/wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./docker/wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./docker/wazuh/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - wazuh_dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh_dashboard_custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks: [cxyz_dc]

  # -------------------- IDS: Suricata (AF-PACKET) ------------------
  suricata:
    profiles: ["ids"]
    image: jasonish/suricata:8.0.1
    hostname: suricata
    restart: unless-stopped
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    network_mode: host          # mirror/monitor the host bridge span
    volumes:
      - ./docker/ids/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./docker/ids/rules:/var/lib/suricata/rules:ro
      - ./docker/ids/logs:/var/log/suricata
    command: ["-i", "any", "-v"]

  # -------------------- Zero-Trust gateway -------------------------
  traefik:
    profiles: ["ztna"]
    image: traefik:v3.1
    hostname: traefik
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
    ports: ["80:80", "443:443", "127.0.0.1:8080:8080"]
    volumes:
      - ./docker/zero-trust-gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [cxyz_edge]

  authentik-server:
    profiles: ["ztna"]
    image: ghcr.io/goauthentik/server:2024.8
    hostname: authentik
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?run make secrets}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?run make secrets}
    depends_on: [authentik-postgres, authentik-redis]
    networks: [cxyz_edge]

  # Background jobs, blueprints, and embedded-outpost lifecycle require a
  # worker in addition to the web server.
  authentik-worker:
    profiles: ["ztna"]
    image: ghcr.io/goauthentik/server:2024.8
    hostname: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?run make secrets}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?run make secrets}
    depends_on: [authentik-postgres, authentik-redis]
    networks: [cxyz_edge]

  authentik-postgres:
    profiles: ["ztna"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?run make secrets}
      POSTGRES_DB: authentik
    volumes: ["authentik_db:/var/lib/postgresql/data"]
    networks: [cxyz_edge]

  authentik-redis:
    profiles: ["ztna"]
    image: redis:7-alpine
    restart: unless-stopped
    networks: [cxyz_edge]

  wireguard:
    profiles: ["ztna"]
    image: linuxserver/wireguard@sha256:ee2db24277b43ec4e7529e93967dc3cea00a02bf81b749c680b2b102a6e4aa5b
    hostname: wireguard
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment:
      - PUID=1000
      - PGID=1000
      - SERVERPORT=${WG_SERVER_PORT:-51820}
      - PEERS=${WG_PEER_COUNT:-4}
      - SERVERURL=${WG_ENDPOINT:-auto}
    ports: ["51820:51820/udp"]
    sysctls: ["net.ipv4.conf.all.src_valid_mark=1"]
    volumes: ["./wireguard/config:/config"]
    networks: [cxyz_edge]

  # -------------------- DMZ demo app (behind gateway) --------------
  dmz-web:
    profiles: ["dmz"]
    image: nginxinc/nginx-unprivileged:stable-alpine
    hostname: dmz-web
    restart: unless-stopped
    networks: [cxyz_edge]

volumes:
  authentik_db:
  cxyz_remote_logs:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh_indexer_data:
  wazuh_dashboard_config:
  wazuh_dashboard_custom:
