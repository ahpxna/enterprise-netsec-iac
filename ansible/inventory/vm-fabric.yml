# Inventory for the REAL VM fabric (terraform/vyos-fabric). Uses
# network_cli over SSH to talk to actual VyOS CLI — different connection
# model from inventory/hosts.yml (which uses the docker connection
# plugin against containerlab nodes).
#
# IPs here must match `terraform output node_mgmt_ips` after `terraform
# apply` in terraform/vyos-fabric/ — update if you changed var.nodes.
all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: vyos.vyos.vyos
    ansible_user: vyos
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  children:
    vyos_routers:
      hosts:
        edge:    { ansible_host: 10.1.1.10 }
        core:    { ansible_host: 10.1.1.1 }
        dist1:   { ansible_host: 10.1.1.2 }
        dist2:   { ansible_host: 10.1.1.3 }
    vyos_firewalls:
      hosts:
        fw-core: { ansible_host: 10.1.1.20 }
        fw-dmz:  { ansible_host: 10.1.1.30 }
