# Inventory maps to the containerlab nodes (reachable on the 10.1.1.0/24 mgmt net).
# Containerlab nodes use the Docker connection plugin (no SSH required),
# allowing `make configure` to run directly on a laptop.
all:
  vars:
    ansible_connection: community.docker.docker
  children:
    firewalls:
      hosts:
        clab-companyxyz-fw-core: {}
        clab-companyxyz-fw-dmz: {}
    routers:
      hosts:
        clab-companyxyz-edge: {}
        clab-companyxyz-core: {}
        clab-companyxyz-dist1: {}
        clab-companyxyz-dist2: {}
    servers:
      hosts:
        clab-companyxyz-server1: {}
    endpoints:
      hosts:
        clab-companyxyz-pc1: {}
        clab-companyxyz-pc4: {}
