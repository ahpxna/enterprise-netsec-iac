---
- name: Data-center identity, time and logging services
  hosts: servers
  gather_facts: true
  roles:
    - role: radius_secure      # IDM-01, IDM-02 (SHA-512-crypt, unique secrets)
      tags: [identity]
    - role: ntp_secure         # TIME-01 on real Linux/VM hosts only
      tags: [time]
      when: ansible_connection | default("") != "community.docker.docker"
    - role: syslog_tls         # DET-02          (TLS log transport)
      tags: [logging]
