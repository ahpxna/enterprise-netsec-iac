---
# Configure the REAL VM fabric (terraform/vyos-fabric). Run this instead
# of / in addition to site.yml when you're on the VyOS-VM path rather than
# the containerlab path.
#
#   ansible-playbook -i ../inventory/vm-fabric.yml playbooks/30-vyos-fabric.yml
#
- name: Push BGP edge + firewall config to real VyOS VMs
  hosts: vyos_routers:vyos_firewalls
  gather_facts: false
  roles:
    - role: vyos_edge
      tags: [vyos, fabric]
