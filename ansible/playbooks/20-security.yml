---
- name: Detection + remote-access controls
  hosts: servers
  roles:
    - role: suricata           # IDS sensor config
      tags: [ids]
    - role: wireguard_vpn      # VPN-01
      tags: [vpn]

- name: Ship device logs through the authenticated TLS relay
  hosts: routers:firewalls
  roles:
    - role: syslog_tls
      tags: [logging, siem]
