---
# Idempotent baseline hardening applied to every node.
# Kept deliberately small and CIS-mapped; each task maps to a control test.

- name: Ensure telnet server is absent (HRD-02 / CIS 1.6.5)
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop: [telnetd, inetutils-telnetd]
  failed_when: false

- name: Detect whether OpenSSH server is installed
  ansible.builtin.stat:
    path: /usr/sbin/sshd
  register: common_hardening_sshd

- name: Ensure OpenSSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"
  when: common_hardening_sshd.stat.exists

- name: Enforce SSH idle timeout and root policy where SSH exists (HRD-01 / CIS 1.8, 5.x)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-cxyz-hardening.conf
    mode: "0644"
    content: |
      # Managed by Ansible — CompanyXYZ-NG common_hardening
      ClientAliveInterval {{ common_hardening_ssh_client_alive_interval }}
      ClientAliveCountMax {{ common_hardening_ssh_client_alive_count_max }}
      PermitRootLogin {{ common_hardening_ssh_permit_root_login }}
      Protocol 2
      Banner /etc/issue.net
  when: common_hardening_sshd.stat.exists
  notify: restart sshd

- name: Enforce interactive shell timeout
  ansible.builtin.copy:
    dest: /etc/profile.d/cxyz-timeout.sh
    mode: "0644"
    content: |
      TMOUT={{ common_hardening_ssh_client_alive_interval }}
      readonly TMOUT
      export TMOUT

- name: Set login banner
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "{{ common_hardening_login_banner }}\n"
    mode: "0644"
