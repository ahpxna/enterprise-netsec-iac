---
# The WireGuard *server* runs as a container (docker-compose ztna profile).
# This role just asserts the control intent on servers: no mgmt port on 0.0.0.0.
- name: Ensure no admin service binds to a public interface (VPN-01)
  ansible.builtin.command: ss -H -tlnp
  register: wireguard_vpn_listeners
  changed_when: false

- name: Reject public administrative listeners
  ansible.builtin.assert:
    that:
      - wireguard_vpn_listeners.stdout is not regex('0\\.0\\.0\\.0:(22|23|3389)(\\s|$)')
    fail_msg: "An administrative service is exposed on all IPv4 interfaces."
