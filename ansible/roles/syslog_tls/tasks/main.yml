---
# Ship logs to the SIEM over TLS instead of cleartext 514.
# Remediates the CYB-240/300 "plaintext syslog" finding directly.
- name: Install rsyslog and the platform TLS driver
  ansible.builtin.package:
    name:
      - rsyslog
      - "{{ 'rsyslog-tls' if ansible_os_family == 'Alpine' else 'rsyslog-gnutls' }}"
    state: present

- name: Install the private logging CA
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/syslog-relay/certs/ca.crt"
    dest: /etc/rsyslog.d/ca.crt
    mode: "0644"

- name: Configure TLS log forwarding to the SIEM
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/60-cxyz-tls.conf
    mode: "0644"
    content: |
      # Managed by Ansible — DET-02 (encrypted log transport)
      global(
        DefaultNetstreamDriver="gtls"
        DefaultNetstreamDriverCAFile="/etc/rsyslog.d/ca.crt"
      )
      action(
        type="omfwd"
        target="172.16.50.11" port="6514" protocol="tcp"
        StreamDriver="gtls"
        StreamDriverMode="1"
        StreamDriverAuthMode="x509/name"
        StreamDriverPermittedPeers="syslog-relay.companyxyz.lab"
      )
  notify: restart rsyslog
