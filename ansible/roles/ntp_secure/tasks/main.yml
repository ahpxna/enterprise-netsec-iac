---
# Authenticated time via NTS (chrony) so log timestamps cannot be spoofed.
# Directly remediates the CYB-300 "NTP authentication missing" finding.
- name: Install chrony
  ansible.builtin.package: { name: chrony, state: present }
  failed_when: false

- name: Configure chrony with NTS upstreams
  ansible.builtin.copy:
    dest: /etc/chrony/chrony.conf
    mode: "0644"
    content: |
      # Managed by Ansible — NTS authenticated time (TIME-01)
      server {{ ntp_upstream_1 }} iburst nts
      server {{ ntp_upstream_2 }} iburst nts
      driftfile /var/lib/chrony/chrony.drift
      makestep 1.0 3
      rtcsync
      # serve authenticated time to the internal fabric
      allow 10.1.1.0/24
      allow 172.16.0.0/16
  notify: restart chrony
