---
# Replaces the CYB-240/300 cleartext-password anti-pattern with hashed
# storage and a strong, per-deployment shared secret (NIST SP 800-63B).

- name: Fail fast if identity secrets were not generated or are reused
  ansible.builtin.assert:
    that:
      - radius_secure_admin_crypt is match('^\\$6\\$')
      - radius_secure_clients | map(attribute='secret') | map('length') | min >= 24
      - radius_secure_clients | map(attribute='secret') | unique | length == radius_secure_clients | length
      - radius_secure_clients | map(attribute='secret') | select('match', '^CHANGE_ME') | list | length == 0
    fail_msg: "Run `make secrets` first — refusing to deploy weak/cleartext creds."

- name: Deploy FreeRADIUS clients.conf (strong shared secret)
  ansible.builtin.template:
    src: clients.conf.j2
    dest: /etc/freeradius/3.0/clients.conf
    mode: "0640"
  notify: restart freeradius

- name: Deploy authorize file with HASHED admin credential only
  ansible.builtin.template:
    src: authorize.j2
    dest: /etc/freeradius/3.0/mods-config/files/authorize
    mode: "0640"
  notify: restart freeradius

- name: Scan active RADIUS user store for a cleartext password attribute
  ansible.builtin.command:
    argv:
      - grep
      - -n
      - Cleartext-Password
      - /etc/freeradius/3.0/mods-config/files/authorize
  register: radius_secure_cleartext_scan
  changed_when: false
  failed_when: radius_secure_cleartext_scan.rc not in [0, 1]

- name: Assert active RADIUS user store contains no cleartext password
  ansible.builtin.assert:
    that: radius_secure_cleartext_scan.rc == 1
    fail_msg: "Cleartext-Password is present in the active RADIUS user store."
