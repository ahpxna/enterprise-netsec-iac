---
# Pulled from .env at runtime; NEVER hard-code a real secret here.
radius_secure_admin_crypt: "{{ lookup('ansible.builtin.env', 'RADIUS_ADMIN_CRYPT') }}"
radius_secure_test_crypt: "{{ lookup('ansible.builtin.env', 'RADIUS_TEST_CRYPT') }}"
radius_secure_clients:
  - name: fw-core
    ip: 10.255.0.5
    secret: "{{ lookup('ansible.builtin.env', 'RADIUS_SECRET_FW_CORE') }}"
  - name: core
    ip: 10.255.0.6
    secret: "{{ lookup('ansible.builtin.env', 'RADIUS_SECRET_CORE') }}"
  - name: edge
    ip: 10.255.0.1
    secret: "{{ lookup('ansible.builtin.env', 'RADIUS_SECRET_EDGE') }}"
  - name: pc4
    ip: 192.168.40.1
    secret: "{{ lookup('ansible.builtin.env', 'RADIUS_SECRET_PC4') }}"
  # Probe-only client: policy still blocks this user VLAN at fw-core. Keeping
  # a server-side client definition lets SEG-01 distinguish a firewall deny
  # from an unknown-client RADIUS discard.
  - name: pc1-validation
    ip: 192.168.10.1
    secret: "{{ lookup('ansible.builtin.env', 'RADIUS_SECRET_PC1_PROBE') }}"
