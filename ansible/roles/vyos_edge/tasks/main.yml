---
# Real config push to actual VyOS routers/firewalls over network_cli.
# Unlike the container path (clab startup-config with no Ansible requirement
# for FRR/nftables), the real-NOS path applies configuration through Ansible
# and records changes in git history.

- name: Determine this node's config.boot path
  ansible.builtin.set_fact:
    vyos_edge_boot_file: "{{ vyos_edge_boot_config_dir }}/{{ inventory_hostname }}.boot"

- name: Fail fast if there's no config.boot for this inventory_hostname
  ansible.builtin.stat:
    path: "{{ vyos_edge_boot_file }}"
  delegate_to: localhost
  become: false
  register: vyos_edge_boot_stat

- name: Assert the node has a declarative boot configuration
  ansible.builtin.assert:
    that: vyos_edge_boot_stat.stat.exists
    fail_msg: >
      No {{ vyos_edge_boot_file }} found. inventory_hostname must match one of
      the config.boot files under terraform/vyos-fabric/configs/
      (edge, fw-core, fw-dmz, core, dist1, dist2).

- name: Assert routing secrets are supplied before Day-2 reconciliation
  ansible.builtin.assert:
    that:
      - vyos_edge_ospf_md5 | length >= 24
      - vyos_edge_bgp_isp1 | length >= 24
      - vyos_edge_bgp_isp2 | length >= 24
      - not vyos_edge_ospf_md5.startswith('CHANGE_ME')
      - not vyos_edge_bgp_isp1.startswith('CHANGE_ME')
      - not vyos_edge_bgp_isp2.startswith('CHANGE_ME')
    fail_msg: "Path B routing secrets must be supplied through ignored .env or an approved secret backend."
  no_log: true

- name: Read active SOC containment entries before Day-2 saves the running config
  vyos.vyos.vyos_command:
    commands:
      - show configuration commands | match "address-group SOC_BLOCKLIST address"
  register: vyos_edge_containment
  changed_when: false
  when: inventory_hostname in ['fw-core', 'fw-dmz']

- name: Refuse Day-2 while a containment would be persisted into the startup config
  ansible.builtin.assert:
    that: >-
      vyos_edge_containment.stdout[0].splitlines()
      | reject('search', '192\\.0\\.2\\.1')
      | list | length == 0
    fail_msg: >-
      SOC_BLOCKLIST holds an active containment entry; saving now would make it permanent.
      Wait for its TTL/rollback (or revert it) and re-run Day-2.
  when: inventory_hostname in ['fw-core', 'fw-dmz']

- name: Read the canonical Path B SSH public key on the controller
  ansible.builtin.set_fact:
    vyos_edge_ssh_public_key: >-
      {{ lookup('ansible.builtin.file', vyos_edge_ssh_public_key_file).split() }}
  no_log: true

- name: Assert the bootstrap public key can be rendered for Day-2
  ansible.builtin.assert:
    that:
      - vyos_edge_ssh_public_key | length >= 2
      - vyos_edge_ssh_public_key[0] is match('^(ssh-|ecdsa-|sk-)')
    fail_msg: "PATH_B_SSH_PUBLIC_KEY_FILE must point at a valid OpenSSH public key."

- name: Reconcile secret-bearing VyOS configuration safely
  block:
    - name: Render a secret-injected Day-2 configuration on the controller
      ansible.builtin.copy:
        content: >-
          {{ lookup('ansible.builtin.file', vyos_edge_boot_file)
             | replace('CHANGE_ME_ospf_key', vyos_edge_ospf_md5)
             | replace('CHANGE_ME_bgp_isp1', vyos_edge_bgp_isp1)
             | replace('CHANGE_ME_bgp_isp2', vyos_edge_bgp_isp2)
             | replace('MANAGEMENT_IP', ansible_host)
             | replace('SSH_KEY_TYPE', vyos_edge_ssh_public_key[0])
             | replace('SSH_KEY_DATA', vyos_edge_ssh_public_key[1]) }}
        dest: "/tmp/cxyz-{{ inventory_hostname }}.boot"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Reconcile declarative VyOS configuration without secret-bearing backups
      vyos.vyos.vyos_config:
        src: "/tmp/cxyz-{{ inventory_hostname }}.boot"
        backup: false
        save: "{{ vyos_edge_save_config }}"
      register: vyos_edge_result
      no_log: true
  always:
    - name: Remove secret-injected Day-2 configuration from the controller
      ansible.builtin.file:
        path: "/tmp/cxyz-{{ inventory_hostname }}.boot"
        state: absent
      delegate_to: localhost
      become: false
      no_log: true

- name: Report whether VyOS reconciliation changed state
  ansible.builtin.debug:
    msg: "VyOS reconciliation changed={{ vyos_edge_result.changed | default(false) }}; commands are redacted because they may contain routing credentials."
