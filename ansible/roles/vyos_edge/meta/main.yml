---
galaxy_info:
  role_name: vyos_edge
  description: >
    Pushes/reconciles VyOS device config (BGP/OSPF/VRRP/firewall) for the
    real VM fabric (terraform/vyos-fabric), using vyos.vyos.vyos_config.
    Idempotent: re-running with an unchanged config.boot is a no-op diff.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: GenericLinux
      versions: [all]
dependencies: []
collections:
  - vyos.vyos
  - ansible.netcommon
