# =====================================================================
# CompanyXYZ-NG — routed enterprise fabric in containerlab
# Re-implements Brezula's GNS3 three-tier + DMZ + dual-ISP design using
# FOSS NOS images that actually boot on a laptop:
#   Cisco vIOS/ASAv/Arista vEOS  ->  FRRouting (frr) + Linux + nftables
# The *design* (zones, VLANs, IP plan, security intent) is preserved 1:1.
# The *implementation* is now free, scriptable and CI-testable.
# =====================================================================
name: companyxyz

mgmt:
  network: cxyz_mgmt
  ipv4-subnet: 10.1.1.0/24        # matches Brezula loopback/mgmt plan

topology:
  kinds:
    linux:
      image: wbitt/network-multitool:latest   # ip, tcpdump, nmap, curl, ncat
    frr:
      image: quay.io/frrouting/frr:9.1.0

  nodes:
    # ---------------- EDGE / ISP (dual-homed, Part 6) ----------------
    isp1:
      kind: frr
      mgmt-ipv4: 10.1.1.201
      startup-config: configs/isp1.frr.conf
    isp2:
      kind: frr
      mgmt-ipv4: 10.1.1.202
      startup-config: configs/isp2.frr.conf
    edge:                                   # vIOS-EDGE-I  (BGP, dual ISP)
      kind: frr
      mgmt-ipv4: 10.1.1.10
      startup-config: configs/edge.frr.conf

    # ---------------- PERIMETER FIREWALL (ASAv-I) -------------------
    fw-core:                                # nftables "default deny" firewall
      kind: linux
      mgmt-ipv4: 10.1.1.20
      binds:
        - configs/fw-core.nft:/etc/nftables/policy.nft:ro
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - nft -f /etc/nftables/policy.nft

    # ---------------- CORE / DISTRIBUTION (L3) ---------------------
    core:                                   # vIOS-Core (OSPF, MD5 auth)
      kind: frr
      mgmt-ipv4: 10.1.1.1
      startup-config: configs/core.frr.conf
    dist1:                                  # vEOS-Dis-I  (VRRP master, prio 150)
      kind: frr
      mgmt-ipv4: 10.1.1.2
      startup-config: configs/dist1.frr.conf
    dist2:                                  # vEOS-Dis-II (VRRP backup, prio 100)
      kind: frr
      mgmt-ipv4: 10.1.1.3
      startup-config: configs/dist2.frr.conf

    # ---------------- ACCESS LAYER + CLIENTS -----------------------
    pc1:                                    # VLAN10 user  (untrusted)
      kind: linux
      mgmt-ipv4: 10.1.1.111
      exec: ["ip addr add 192.168.10.1/24 dev eth1 || true"]
    pc4:                                    # VLAN40 mgmt  (admin station)
      kind: linux
      mgmt-ipv4: 10.1.1.144
      exec: ["ip addr add 192.168.40.1/24 dev eth1 || true"]

    # ---------------- DATA CENTER (Server1) ------------------------
    server1:                                # DNS/DHCP/NTP/RADIUS/Syslog host
      kind: linux
      mgmt-ipv4: 10.1.1.50
      exec: ["ip addr add 172.16.50.1/24 dev eth1 || true"]

    # ---------------- DMZ (Part 7) --------------------------------
    fw-dmz:                                 # ASAv-DMZ-I -> nftables
      kind: linux
      mgmt-ipv4: 10.1.1.30
      binds:
        - configs/fw-dmz.nft:/etc/nftables/policy.nft:ro
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - nft -f /etc/nftables/policy.nft
    dmz-web:                                # Serv-DMZ-I public web 195.1.1.161
      kind: linux
      mgmt-ipv4: 10.1.1.61
      exec: ["ip addr add 195.1.1.161/29 dev eth1 || true"]

  links:
    # edge <-> ISPs (dual homing)
    - endpoints: ["edge:eth1", "isp1:eth1"]
    - endpoints: ["edge:eth2", "isp2:eth1"]
    # edge <-> perimeter firewall
    - endpoints: ["edge:eth3", "fw-core:eth1"]
    # edge <-> dmz firewall (DMZ hangs off the edge, per Brezula)
    - endpoints: ["edge:eth4", "fw-dmz:eth1"]
    # fw-core <-> core
    - endpoints: ["fw-core:eth2", "core:eth1"]
    # core <-> distribution (redundant)
    - endpoints: ["core:eth2", "dist1:eth1"]
    - endpoints: ["core:eth3", "dist2:eth1"]
    # distribution <-> access clients
    - endpoints: ["dist1:eth2", "pc1:eth1"]
    - endpoints: ["dist2:eth2", "pc4:eth1"]
    # core <-> data center
    - endpoints: ["core:eth4", "server1:eth1"]
    # dmz firewall <-> dmz web
    - endpoints: ["fw-dmz:eth2", "dmz-web:eth1"]
