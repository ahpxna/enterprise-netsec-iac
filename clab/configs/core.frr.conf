! vIOS-Core-I -> FRR. OSPF backbone with MD5 message-digest auth.
frr defaults traditional
hostname core
password zebra
!
interface eth2
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 CHANGE_ME_ospf_key
interface eth3
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 CHANGE_ME_ospf_key
!
router ospf
 ospf router-id 10.1.1.1
 default-information originate
 network 10.255.1.0/31 area 0
 network 10.255.1.2/31 area 0
 passive-interface default
 no passive-interface eth2
 no passive-interface eth3
!
line vty
