! ISP2 (AS65020)
frr defaults traditional
hostname isp2
! Lab-only routed WAN probe path; fw-core must still reject it.
ip route 172.16.50.0/24 197.10.10.2
router bgp 65020
 bgp router-id 197.10.10.1
 neighbor 197.10.10.2 remote-as 65001
 neighbor 197.10.10.2 password CHANGE_ME_bgp_isp2
 neighbor 197.10.10.2 ttl-security hops 1
 address-family ipv4 unicast
  neighbor 197.10.10.2 default-originate
 exit-address-family
line vty
