! vIOS-EDGE-I  ->  FRR
! BGP to two ISPs with password + GTSM (ttl-security).
! Outbound route filter prevents internal-route leakage to the Internet.
frr defaults traditional
hostname edge
!
password zebra
enable password zebra
!
router bgp 65001
 bgp router-id 195.1.1.2
 neighbor 198.10.10.1 remote-as 65010
 neighbor 198.10.10.1 password CHANGE_ME_bgp_isp1
 neighbor 198.10.10.1 ttl-security hops 1
 neighbor 197.10.10.1 remote-as 65020
 neighbor 197.10.10.1 password CHANGE_ME_bgp_isp2
 neighbor 197.10.10.1 ttl-security hops 1
 address-family ipv4 unicast
  network 195.1.1.0/24
  neighbor 198.10.10.1 route-map ONLY-OURS out
  neighbor 197.10.10.1 route-map ONLY-OURS out
  neighbor 198.10.10.1 route-map ISP-DEFAULT-ONLY in
  neighbor 197.10.10.1 route-map ISP-DEFAULT-ONLY in
exit-address-family
!
! Keep the approved aggregate in the RIB so BGP can originate it.
ip route 195.1.1.0/24 Null0
!
ip prefix-list OURS seq 5 permit 195.1.1.0/24
route-map ONLY-OURS permit 10
 match ip address prefix-list OURS
route-map ONLY-OURS deny 20
!
! Inbound: accept only a default route from each ISP. eBGP requires an explicit
! import policy, and edge must never install an ISP's other prefixes.
ip prefix-list ISP-DEFAULT seq 5 permit 0.0.0.0/0
route-map ISP-DEFAULT-ONLY permit 10
 match ip address prefix-list ISP-DEFAULT
route-map ISP-DEFAULT-ONLY deny 20
!
line vty
