! ISP1 (AS65010) — accepts the enterprise /24 and advertises a default route
frr defaults traditional
hostname isp1
! Lab-only routed WAN probe path; fw-core must still reject it.
ip route 172.16.50.0/24 198.10.10.2
router bgp 65010
 bgp router-id 198.10.10.1
 neighbor 198.10.10.2 remote-as 65001
 neighbor 198.10.10.2 password CHANGE_ME_bgp_isp1
 neighbor 198.10.10.2 ttl-security hops 1
 address-family ipv4 unicast
  neighbor 198.10.10.2 default-originate
 exit-address-family
line vty
