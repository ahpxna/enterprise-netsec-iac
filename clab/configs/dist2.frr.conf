! Distribution-2: independent routed uplink, backup for both shared VLANs.
frr defaults traditional
hostname dist2
password zebra
!
interface eth1
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 CHANGE_ME_ospf_key
interface eth2
 vrrp 10 version 3
 vrrp 10 ip 192.168.10.254
 vrrp 10 priority 100
 vrrp 10 advertisement-interval 300
interface eth3
 vrrp 40 version 3
 vrrp 40 ip 192.168.40.254
 vrrp 40 priority 100
 vrrp 40 advertisement-interval 300
!
router ospf
 ospf router-id 10.1.1.3
 network 10.255.1.2/31 area 0
 network 192.168.10.0/24 area 0
 network 192.168.40.0/24 area 0
 passive-interface default
 no passive-interface eth1
!
line vty
